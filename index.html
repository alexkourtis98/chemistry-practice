<script>
function chemFormat(s) {
  s = s.replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3').replace(/₄/g,'4')
       .replace(/₅/g,'5').replace(/₆/g,'6').replace(/₇/g,'7').replace(/₈/g,'8').replace(/₉/g,'9');
  s = s.replace(/⁺/g,'+').replace(/⁻/g,'-');
  s = s.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
  s = s.replace(/(\d*)([\+\-])$/g, '<sup>$1$2</sup>');
  return s;
}

function normalizeForCompare(s) {
  s = s.trim().toLowerCase().replace(/\s+/g,' ');
  // Greek accent normalization
  s = s.replace(/ά/g,'α').replace(/έ/g,'ε').replace(/ή/g,'η').replace(/ί/g,'ι')
       .replace(/ό/g,'ο').replace(/ύ/g,'υ').replace(/ώ/g,'ω').replace(/ΐ/g,'ι').replace(/ΰ/g,'υ');
  // Subscript/superscript normalization
  s = s.replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3').replace(/₄/g,'4')
       .replace(/₅/g,'5').replace(/₆/g,'6').replace(/₇/g,'7').replace(/₈/g,'8').replace(/₉/g,'9');
  s = s.replace(/⁺/g,'+').replace(/⁻/g,'-');
  return s;
}

  9: '<h3>Binary Compound Nomenclature</h3><p><span class="rule">Rule:</span> [metal name] + [nonmetal root + -ide]</p><table><tr><th>Nonmetal</th><th>Suffix</th></tr><tr><td>Cl (chlorine)</td><td>chlor-ide</td></tr><tr><td>O (oxygen)</td><td>ox-ide</td></tr><tr><td>S (sulfur)</td><td>sulf-ide</td></tr><tr><td>F (fluorine)</td><td>fluor-ide</td></tr><tr><td>P (phosphorus)</td><td>phosph-ide</td></tr></table><p>NaCl = sodium chloride, MgO = magnesium oxide</p>',
  10: '<h3>Transition Metals: Roman Numerals</h3><p>Transition metals can form multiple ions, so a <span class="rule">Roman numeral</span> is needed in the name.</p><table><tr><th>Formula</th><th>Fe charge</th><th>Name</th></tr><tr><td>FeO</td><td>+2</td><td>Iron(II) oxide</td></tr><tr><td>Fe₂O₃</td><td>+3</td><td>Iron(III) oxide</td></tr><tr><td>CuCl</td><td>+1</td><td>Copper(I) chloride</td></tr><tr><td>CuCl₂</td><td>+2</td><td>Copper(II) chloride</td></tr></table><p><span class="rule">How to find the charge:</span> The compound is neutral, so metal charge = opposite of total nonmetal charge.</p>',
  11: '<h3>Polyatomic Compound Nomenclature</h3><p><span class="rule">Rule:</span> [metal name] + [polyatomic ion name]</p><ul><li>NaOH = sodium hydroxide</li><li>Ca(OH)₂ = calcium hydroxide</li><li>KNO₃ = potassium nitrate</li><li>Na₂CO₃ = sodium carbonate</li><li>(NH₄)₂SO₄ = ammonium sulfate</li></ul><p><span class="rule">With transition metals:</span> Add Roman numeral, e.g. Fe₂(SO₄)₃ = iron(III) sulfate</p>',
  12: '<h3>The Mole: n = m / M</h3><p><span class="rule">n</span> = number of moles</p><p><span class="rule">m</span> = mass in grams (g)</p><p><span class="rule">M</span> = molar mass (g/mol)</p><table><tr><th>Formula</th><th>Find</th></tr><tr><td>n = m / M</td><td>moles</td></tr><tr><td>m = n × M</td><td>mass (g)</td></tr><tr><td>M = m / n</td><td>molar mass</td></tr></table><p>Example: 36 g H₂O, M = 18 g/mol → n = 36/18 = 2 mol</p><p><span class="rule">1 mol</span> = 6.022 × 10²³ particles (Avogadro\'s number)</p>',
  13: '<h3>Molar Mass Calculation (M)</h3><p><span class="rule">Steps:</span></p><ul><li>1. Write the formula</li><li>2. Count the atoms of each element</li><li>3. Multiply × atomic mass</li><li>4. Add them all</li></ul><p>Example: Ca(OH)₂</p><ul><li>Ca: 1 × 40 = 40</li><li>O: 2 × 16 = 32</li><li>H: 2 × 1 = 2</li><li>Total: 74 g/mol</li></ul><p><span class="rule">Watch the parentheses!</span> Ca(OH)₂ = 1 Ca + 2 O + 2 H</p>',
  14: '<h3>Review of Key Concepts</h3><ul><li><span class="rule">Z:</span> Atomic number = protons = element identity</li><li><span class="rule">Isotopes:</span> Same Z, different A (neutrons)</li><li><span class="rule">Cation:</span> Loses e⁻ → positive (+)</li><li><span class="rule">Anion:</span> Gains e⁻ → negative (−)</li><li><span class="rule">Octet rule:</span> 8 e⁻ in the outer shell = stability</li><li><span class="rule">Criss-cross:</span> Charge of one → subscript of the other</li><li><span class="rule">1 mol:</span> 6.022 × 10²³ particles</li><li><span class="rule">n = m / M:</span> Basic mole formula</li></ul>',
  15: '<h3>Mixed Challenge: Tips</h3><ul><li><span class="rule">Nomenclature:</span> First identify if it is a binary or polyatomic compound</li><li><span class="rule">Criss-cross:</span> Write charges → swap → simplify → parentheses if polyatomic</li><li><span class="rule">M:</span> Count ALL atoms (watch parentheses & subscripts)</li><li><span class="rule">n = m / M:</span> First find M, then n</li><li><span class="rule">Valence e⁻:</span> Check the group on the P.T.</li><li><span class="rule">Metal charge:</span> Compound is neutral → solve the charge equation</li></ul>',
  16: '<h3>Isotopic Abundance & Atomic Weight</h3><p><span class="rule">Formula:</span> Atomic weight = sum(mass_i × fraction_i)</p><p><span class="rule">Steps:</span></p><ul><li>1. Convert % to decimal (÷100)</li><li>2. Multiply mass × fraction for each isotope</li><li>3. Add all products</li></ul><p>Example: Cl = 75.77% × 34.97 + 24.23% × 36.97 = 35.45 u</p><p><span class="rule">Key:</span> The result must fall BETWEEN the smallest and largest isotope mass.</p>',
  17: '<h3>Isobars, Radioisotopes & Nuclides</h3><p><span class="rule">Isotopes:</span> Same Z, different A (same element)</p><p><span class="rule">Isobars:</span> Same A, different Z (DIFFERENT elements)</p><p><span class="rule">Nuclide:</span> A specific nuclear type (Z+N)</p><p><span class="rule">Radioisotopes:</span> Unstable nuclides → radioactive decay</p><table><tr><th>Example</th><th>Type</th></tr><tr><td>¹²C, ¹⁴C</td><td>Isotopes (Z=6)</td></tr><tr><td>¹⁴C, ¹⁴N</td><td>Isobars (A=14)</td></tr></table><p>Deuterium (²H/D): 1p+1n. Tritium (³H/T): 1p+2n (radioactive).</p>',
  18: '<h3>Covalent Compounds: Greek Prefixes</h3><p><span class="rule">Rule:</span> Nonmetal + nonmetal → covalent → Greek prefixes</p><table><tr><th>Number</th><th>Prefix</th></tr><tr><td>1</td><td>mono-</td></tr><tr><td>2</td><td>di-</td></tr><tr><td>3</td><td>tri-</td></tr><tr><td>4</td><td>tetra-</td></tr><tr><td>5</td><td>penta-</td></tr><tr><td>6</td><td>hexa-</td></tr></table><p><span class="rule">Rule:</span> Omit "mono-" for the FIRST element.</p><p>CO₂ = carbon dioxide, N₂O₅ = dinitrogen pentoxide</p>',
  19: '<h3>Acid Nomenclature</h3><table><tr><th>Anion ends in</th><th>Acid name</th><th>Example</th></tr><tr><td>-ide</td><td>hydro___ic acid</td><td>Cl⁻ → HCl = hydrochloric acid</td></tr><tr><td>-ate</td><td>___ic acid</td><td>SO₄²⁻ → H₂SO₄ = sulfuric acid</td></tr><tr><td>-ite</td><td>___ous acid</td><td>SO₃²⁻ → H₂SO₃ = sulfurous acid</td></tr></table><p><span class="rule">Mnemonic:</span> "-ate → -ic (I ate something ICky)", "-ite → -ous (not right for US)"</p>',
  20: '<h3>Final Review: All Types</h3><ul><li><span class="rule">Z</span> = protons, <span class="rule">A</span> = protons + neutrons</li><li><span class="rule">Isotopes:</span> same Z, <span class="rule">Isobars:</span> same A</li><li><span class="rule">Atomic weight</span> = sum(mass × fraction)</li><li><span class="rule">Ionic:</span> metal + nonmetal → Rule A</li><li><span class="rule">Covalent:</span> nonmetal + nonmetal → Greek prefixes</li><li><span class="rule">Transition metals:</span> Roman numerals (Zn, Ag exceptions)</li><li><span class="rule">Acids:</span> -ide→hydro_ic, -ate→_ic, -ite→_ous</li><li><span class="rule">n = m / M</span>, 1 mol = 6.022 × 10²³</li></ul>',
  21: '<h3>Quantum Numbers & Electron Configuration</h3><table><tr><th>Quantum #</th><th>Symbol</th><th>Values</th><th>Describes</th></tr><tr><td>Principal</td><td>n</td><td>1, 2, 3...</td><td>Shell / energy level</td></tr><tr><td>Angular</td><td>l</td><td>0 to n−1</td><td>Subshell shape (s,p,d,f)</td></tr><tr><td>Magnetic</td><td>ml</td><td>−l to +l</td><td>Orbital orientation</td></tr><tr><td>Spin</td><td>ms</td><td>+1/2, −1/2</td><td>Electron spin</td></tr></table><p><span class="rule">Max electrons per shell:</span> 2n²</p><p><span class="rule">Aufbau order:</span> 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p...</p>',
  22: '<h3>Periodic Trends</h3><table><tr><th>Property</th><th>Across period (→)</th><th>Down group (↓)</th></tr><tr><td>Atomic radius</td><td>Decreases</td><td>Increases</td></tr><tr><td>Ionization energy</td><td>Increases</td><td>Decreases</td></tr><tr><td>Electronegativity</td><td>Increases</td><td>Decreases</td></tr><tr><td>Electron affinity</td><td>More negative (generally)</td><td>Less negative</td></tr><tr><td>Metallic character</td><td>Decreases</td><td>Increases</td></tr></table><p><span class="rule">Most electronegative:</span> F (3.98). <span class="rule">Largest atom:</span> Fr (bottom-left).</p>',
  23: '<h3>Lewis Structures</h3><p><span class="rule">Steps:</span></p><ul><li>1. Count total valence electrons</li><li>2. Place central atom, connect outer atoms with single bonds</li><li>3. Complete octets on outer atoms</li><li>4. Place remaining electrons on central atom</li><li>5. Form double/triple bonds if central atom lacks an octet</li></ul><p><span class="rule">Valence e⁻:</span> Group 1=1, 2=2, 13=3, 14=4, 15=5, 16=6, 17=7, 18=8</p>',
  24: '<h3>VSEPR & Molecular Geometry</h3><table><tr><th>Bonds</th><th>Lone pairs</th><th>Shape</th><th>Example</th></tr><tr><td>2</td><td>0</td><td>Linear</td><td>CO₂</td></tr><tr><td>3</td><td>0</td><td>Trigonal planar</td><td>BF₃</td></tr><tr><td>2</td><td>1</td><td>Bent</td><td>SO₂</td></tr><tr><td>4</td><td>0</td><td>Tetrahedral</td><td>CH₄</td></tr><tr><td>3</td><td>1</td><td>Trigonal pyramidal</td><td>NH₃</td></tr><tr><td>2</td><td>2</td><td>Bent</td><td>H₂O</td></tr><tr><td>5</td><td>0</td><td>Trigonal bipyramidal</td><td>PCl₅</td></tr><tr><td>6</td><td>0</td><td>Octahedral</td><td>SF₆</td></tr></table>',
  25: '<h3>Balancing Chemical Equations</h3><p><span class="rule">Law of Conservation of Mass:</span> Atoms in = atoms out.</p><ul><li>1. Write the unbalanced equation</li><li>2. Count atoms of each element on both sides</li><li>3. Add coefficients to balance (start with the most complex molecule)</li><li>4. Check: all elements balanced, smallest whole-number coefficients</li></ul><p><span class="rule">Never change subscripts!</span> Only change coefficients.</p>',
  26: '<h3>Types of Chemical Reactions</h3><table><tr><th>Type</th><th>Pattern</th><th>Example</th></tr><tr><td>Synthesis</td><td>A + B → AB</td><td>2Na + Cl₂ → 2NaCl</td></tr><tr><td>Decomposition</td><td>AB → A + B</td><td>2H₂O → 2H₂ + O₂</td></tr><tr><td>Single replacement</td><td>A + BC → AC + B</td><td>Zn + CuSO₄ → ZnSO₄ + Cu</td></tr><tr><td>Double replacement</td><td>AB + CD → AD + CB</td><td>AgNO₃ + NaCl → AgCl + NaNO₃</td></tr><tr><td>Combustion</td><td>CₓHᵧ + O₂ → CO₂ + H₂O</td><td>CH₄ + 2O₂ → CO₂ + 2H₂O</td></tr></table>',
  27: '<h3>Solutions & Concentration</h3><p><span class="rule">Molarity (M)</span> = moles of solute / liters of solution = n / V</p><p><span class="rule">Dilution:</span> M₁V₁ = M₂V₂</p><ul><li>To find moles: n = M × V</li><li>To find mass: m = n × molar mass</li><li>Convert mL to L: divide by 1000</li></ul><p>Example: 2 mol NaCl in 0.5 L → M = 2/0.5 = 4 M</p>',
  28: '<h3>Gas Laws</h3><table><tr><th>Law</th><th>Formula</th><th>Constant</th></tr><tr><td>Boyle</td><td>P₁V₁ = P₂V₂</td><td>T, n</td></tr><tr><td>Charles</td><td>V₁/T₁ = V₂/T₂</td><td>P, n</td></tr><tr><td>Combined</td><td>P₁V₁/T₁ = P₂V₂/T₂</td><td>n</td></tr><tr><td>Ideal Gas</td><td>PV = nRT</td><td>—</td></tr></table><p><span class="rule">R</span> = 0.0821 L·atm/(mol·K)</p><p><span class="rule">STP:</span> T = 273 K (0°C), P = 1 atm. Molar volume = 22.4 L/mol</p>',
  29: '<h3>Acids, Bases & pH</h3><p><span class="rule">pH</span> = −log[H⁺], <span class="rule">pOH</span> = −log[OH⁻]</p><p><span class="rule">pH + pOH = 14</span> (at 25°C)</p><table><tr><th>pH</th><th>Type</th></tr><tr><td>&lt; 7</td><td>Acidic</td></tr><tr><td>= 7</td><td>Neutral</td></tr><tr><td>&gt; 7</td><td>Basic</td></tr></table><p><span class="rule">Strong acids:</span> HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄ (ionize completely)</p><p><span class="rule">Strong bases:</span> NaOH, KOH, Ca(OH)₂</p>',
  30: '<h3>Redox Reactions</h3><p><span class="rule">OIL RIG:</span> Oxidation Is Loss, Reduction Is Gain (of electrons)</p><ul><li><span class="rule">Oxidation:</span> Loss of electrons, increase in oxidation number</li><li><span class="rule">Reduction:</span> Gain of electrons, decrease in oxidation number</li><li><span class="rule">Oxidizing agent:</span> Gets reduced (takes electrons)</li><li><span class="rule">Reducing agent:</span> Gets oxidized (gives electrons)</li></ul><p><span class="rule">Rules:</span> Free element = 0, O = −2 (usually), H = +1 (usually), sum = charge of species</p>',
  31: '<h3>Intro to Organic Chemistry</h3><p><span class="rule">Organic chemistry:</span> Study of carbon-containing compounds.</p><ul><li>Carbon forms 4 covalent bonds</li><li><span class="rule">sp³</span> = 4 single bonds (tetrahedral, 109.5°)</li><li><span class="rule">sp²</span> = 1 double + 2 single bonds (trigonal planar, 120°)</li><li><span class="rule">sp</span> = 1 triple + 1 single bond (linear, 180°)</li></ul><p><span class="rule">Hydrocarbons:</span> Compounds of C and H only (alkanes, alkenes, alkynes, aromatics)</p>',
  32: '<h3>Alkane Naming (IUPAC)</h3><table><tr><th>C atoms</th><th>Prefix</th><th>Name</th><th>Formula</th></tr><tr><td>1</td><td>meth-</td><td>methane</td><td>CH₄</td></tr><tr><td>2</td><td>eth-</td><td>ethane</td><td>C₂H₆</td></tr><tr><td>3</td><td>prop-</td><td>propane</td><td>C₃H₈</td></tr><tr><td>4</td><td>but-</td><td>butane</td><td>C₄H₁₀</td></tr><tr><td>5</td><td>pent-</td><td>pentane</td><td>C₅H₁₂</td></tr><tr><td>6-10</td><td>hex/hept/oct/non/dec</td><td>—</td><td>—</td></tr></table><p><span class="rule">General formula:</span> CₙH₂ₙ₊₂. <span class="rule">Suffix:</span> -ane</p>',
  33: '<h3>Alkenes & Alkynes</h3><table><tr><th>Type</th><th>Bond</th><th>Suffix</th><th>Formula</th></tr><tr><td>Alkene</td><td>C=C (double)</td><td>-ene</td><td>CₙH₂ₙ</td></tr><tr><td>Alkyne</td><td>C≡C (triple)</td><td>-yne</td><td>CₙH₂ₙ₋₂</td></tr></table><p><span class="rule">Geometric isomers:</span> cis (same side) vs trans (opposite sides) around a C=C double bond.</p><p>Examples: ethene (C₂H₄), propene (C₃H₆), ethyne (C₂H₂)</p>',
  34: '<h3>Functional Groups</h3><table><tr><th>Group</th><th>Name</th><th>Suffix/Class</th></tr><tr><td>-OH</td><td>Hydroxyl</td><td>Alcohol (-ol)</td></tr><tr><td>-COOH</td><td>Carboxyl</td><td>Carboxylic acid (-oic acid)</td></tr><tr><td>-NH₂</td><td>Amino</td><td>Amine (-amine)</td></tr><tr><td>-CHO</td><td>Aldehyde</td><td>Aldehyde (-al)</td></tr><tr><td>C=O</td><td>Carbonyl</td><td>Ketone (-one)</td></tr><tr><td>-O-</td><td>Ether</td><td>Ether</td></tr><tr><td>-COO-</td><td>Ester</td><td>Ester (-oate)</td></tr></table>',
  35: '<h3>Thermochemistry</h3><p><span class="rule">q = mcΔT</span> (q=heat, m=mass, c=specific heat, ΔT=temp change)</p><ul><li><span class="rule">Exothermic:</span> ΔH &lt; 0, releases heat</li><li><span class="rule">Endothermic:</span> ΔH &gt; 0, absorbs heat</li></ul><p><span class="rule">Hess\'s Law:</span> Total ΔH depends only on initial and final states, not the path.</p><p>Specific heat of water: c = 4.18 J/(g·°C)</p>',
  36: '<h3>Chemical Kinetics</h3><ul><li><span class="rule">Rate:</span> Change in concentration over time</li><li><span class="rule">Rate law:</span> rate = k[A]ᵐ[B]ⁿ (determined experimentally)</li><li><span class="rule">Activation energy (Ea):</span> Minimum energy needed for reaction</li></ul><p><span class="rule">Factors affecting rate:</span></p><ul><li>Temperature (higher → faster)</li><li>Concentration (higher → faster)</li><li>Surface area (more → faster)</li><li>Catalyst (lowers Ea)</li></ul>',
  37: '<h3>Chemical Equilibrium</h3><p><span class="rule">Kc expression:</span> For aA + bB ⇌ cC + dD: Kc = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ</p><ul><li>Kc >> 1: products favored</li><li>Kc << 1: reactants favored</li><li>Pure solids and liquids NOT included in Kc</li></ul><p><span class="rule">Le Chatelier\'s Principle:</span> If a system at equilibrium is disturbed, it shifts to counteract the change.</p><ul><li>Add reactant → shifts right</li><li>Remove product → shifts right</li><li>Increase T (exothermic) → shifts left</li></ul>',
  38: '<h3>Electrochemistry</h3><table><tr><th></th><th>Galvanic (Voltaic)</th><th>Electrolytic</th></tr><tr><td>Spontaneous?</td><td>Yes</td><td>No (needs electricity)</td></tr><tr><td>E°cell</td><td>&gt; 0</td><td>&lt; 0</td></tr><tr><td>Use</td><td>Battery</td><td>Electroplating</td></tr></table><p><span class="rule">Anode:</span> Oxidation occurs (−). <span class="rule">Cathode:</span> Reduction occurs (+).</p><p><span class="rule">E°cell</span> = E°cathode − E°anode</p>',
  39: '<h3>Nuclear Chemistry</h3><table><tr><th>Radiation</th><th>Symbol</th><th>Charge</th><th>Mass</th><th>Penetration</th></tr><tr><td>Alpha</td><td>α / ⁴₂He</td><td>+2</td><td>4</td><td>Low (paper stops)</td></tr><tr><td>Beta</td><td>β⁻ / ⁰₋₁e</td><td>−1</td><td>≈0</td><td>Medium (foil stops)</td></tr><tr><td>Gamma</td><td>γ</td><td>0</td><td>0</td><td>High (lead/concrete)</td></tr></table><p><span class="rule">Half-life:</span> Time for half the radioactive atoms to decay.</p><p><span class="rule">Fission:</span> Heavy nucleus splits. <span class="rule">Fusion:</span> Light nuclei combine.</p>',
  40: '<h3>Intermolecular Forces</h3><table><tr><th>Force</th><th>Strength</th><th>Occurs in</th></tr><tr><td>Ion-dipole</td><td>Strongest</td><td>Ions + polar molecules</td></tr><tr><td>Hydrogen bonding</td><td>Strong</td><td>H bonded to F, O, or N</td></tr><tr><td>Dipole-dipole</td><td>Moderate</td><td>Polar molecules</td></tr><tr><td>London dispersion</td><td>Weakest</td><td>All molecules</td></tr></table><p><span class="rule">Key:</span> Stronger IMFs → higher boiling point, higher viscosity, lower vapor pressure.</p>',
  41: '<h3>Advanced Stoichiometry</h3><ul><li><span class="rule">Limiting reagent:</span> The reactant that runs out first and limits the product</li><li><span class="rule">Excess reagent:</span> The reactant left over</li><li><span class="rule">Percent yield</span> = (actual yield / theoretical yield) × 100</li></ul><p><span class="rule">Empirical formula:</span> Simplest whole-number ratio of atoms.</p><p><span class="rule">Molecular formula:</span> Actual number of atoms. Molecular = n × empirical (where n = molar mass / empirical mass).</p>',
  42: '<h3>Aromatic Compounds</h3><p><span class="rule">Benzene (C₆H₆):</span> A 6-carbon ring with alternating double bonds (3 C=C), but actually has delocalized π electrons.</p><ul><li><span class="rule">Aromaticity:</span> Planar, cyclic, conjugated, 4n+2 π electrons (Huckel rule)</li><li>Benzene: 6 π electrons (n=1)</li></ul><table><tr><th>Substituent</th><th>Name</th></tr><tr><td>-CH₃</td><td>Toluene (methylbenzene)</td></tr><tr><td>-OH</td><td>Phenol</td></tr><tr><td>-NH₂</td><td>Aniline</td></tr></table>',
  43: '<h3>Organic Reactions</h3><table><tr><th>Type</th><th>Description</th><th>Example</th></tr><tr><td>Addition</td><td>Atoms add across a double/triple bond</td><td>C₂H₄ + HBr → C₂H₅Br</td></tr><tr><td>Elimination</td><td>Atoms removed to form a double bond</td><td>C₂H₅OH → C₂H₄ + H₂O</td></tr><tr><td>Substitution</td><td>One atom/group replaces another</td><td>CH₄ + Cl₂ → CH₃Cl + HCl</td></tr><tr><td>Condensation</td><td>Two molecules join, losing H₂O</td><td>Acid + alcohol → ester + H₂O</td></tr></table>',
  44: '<h3>Polymers & Biochemistry</h3><p><span class="rule">Polymer:</span> Large molecule made of repeating monomer units.</p><table><tr><th>Type</th><th>Mechanism</th><th>Example</th></tr><tr><td>Addition</td><td>Monomers add (no byproduct)</td><td>Polyethylene</td></tr><tr><td>Condensation</td><td>Monomers join, lose H₂O</td><td>Nylon, polyester</td></tr></table><p><span class="rule">Biomolecules:</span></p><ul><li>Proteins = amino acids</li><li>Carbohydrates = monosaccharides (glucose)</li><li>Lipids = glycerol + fatty acids</li><li>Nucleic acids = nucleotides</li></ul>',
  45: '<h3>Isomerism</h3><table><tr><th>Type</th><th>Description</th><th>Example</th></tr><tr><td>Structural (constitutional)</td><td>Different connectivity</td><td>Butane vs isobutane</td></tr><tr><td>Geometric (cis/trans)</td><td>Same connectivity, different spatial arrangement around C=C</td><td>cis-2-butene vs trans-2-butene</td></tr><tr><td>Optical (enantiomers)</td><td>Non-superimposable mirror images</td><td>D-alanine vs L-alanine</td></tr></table><p><span class="rule">Chiral center:</span> Carbon with 4 different groups attached.</p>',
  46: '<h3>Coordination Compounds</h3><p><span class="rule">Coordination compound:</span> Metal center bonded to ligands.</p><table><tr><th>Ligand</th><th>Name in complex</th><th>Type</th></tr><tr><td>NH₃</td><td>ammine</td><td>Neutral</td></tr><tr><td>H₂O</td><td>aqua</td><td>Neutral</td></tr><tr><td>Cl⁻</td><td>chlorido</td><td>Anionic</td></tr><tr><td>CN⁻</td><td>cyanido</td><td>Anionic</td></tr><tr><td>OH⁻</td><td>hydroxido</td><td>Anionic</td></tr></table><p><span class="rule">Naming:</span> Ligands (alphabetical) + metal + oxidation state (Roman numeral). Anionic complex ends in -ate.</p><p><span class="rule">Coordination number:</span> Number of bonds from ligands to metal.</p>',
  47: '<h3>Light, Wavelength & Photon Energy</h3><p><span class="rule">c = λν</span> (speed of light = wavelength × frequency)</p><p><span class="rule">E = hν</span> (energy = Planck\'s constant × frequency)</p><p><span class="rule">E = hc/λ</span> (combining both equations)</p><table><tr><th>Constant</th><th>Value</th></tr><tr><td>c (speed of light)</td><td>3.00 × 10⁸ m/s</td></tr><tr><td>h (Planck\'s constant)</td><td>6.626 × 10⁻³⁴ J·s</td></tr></table><p><span class="rule">Key:</span> Higher frequency = shorter wavelength = higher energy. Visible light: ~400 nm (violet) to ~700 nm (red).</p>',
  48: '<h3>Molecular Orbital Theory</h3><p><span class="rule">Bond order</span> = (bonding e⁻ − antibonding e⁻) / 2</p><ul><li>Bond order 0 → molecule doesn\'t exist</li><li>Higher bond order → stronger, shorter bond</li></ul><table><tr><th>Bond type</th><th>Overlap</th></tr><tr><td>σ (sigma)</td><td>Head-on (end-to-end)</td></tr><tr><td>π (pi)</td><td>Side-to-side (lateral)</td></tr></table><p><span class="rule">Paramagnetic:</span> Has unpaired electrons (attracted to magnet). <span class="rule">Diamagnetic:</span> All electrons paired.</p><p>O₂ is paramagnetic (2 unpaired e⁻ in π* orbitals).</p>',
  49: '<h3>Colligative Properties</h3><p>Properties that depend on <span class="rule">number</span> of solute particles, not their identity.</p><table><tr><th>Property</th><th>Formula</th><th>Effect</th></tr><tr><td>Boiling point elevation</td><td>ΔTb = iKbm</td><td>BP increases</td></tr><tr><td>Freezing point depression</td><td>ΔTf = iKfm</td><td>FP decreases</td></tr><tr><td>Osmotic pressure</td><td>π = iMRT</td><td>—</td></tr></table><p><span class="rule">i (van\'t Hoff factor):</span> Number of particles per formula unit. NaCl → 2, CaCl₂ → 3, glucose → 1.</p>',
  50: '<h3>Phase Diagrams & Changes of State</h3><table><tr><th>Transition</th><th>Name</th><th>Energy</th></tr><tr><td>Solid → Liquid</td><td>Melting (fusion)</td><td>Endothermic</td></tr><tr><td>Liquid → Gas</td><td>Vaporization (boiling)</td><td>Endothermic</td></tr><tr><td>Solid → Gas</td><td>Sublimation</td><td>Endothermic</td></tr><tr><td>Gas → Liquid</td><td>Condensation</td><td>Exothermic</td></tr><tr><td>Gas → Solid</td><td>Deposition</td><td>Exothermic</td></tr></table><p><span class="rule">Triple point:</span> All three phases coexist. <span class="rule">Critical point:</span> Above this, liquid and gas are indistinguishable (supercritical fluid).</p><p><span class="rule">Heating curve:</span> Plateaus = phase changes (temperature constant while heat is added).</p>',
  51: '<h3>Buffer Solutions</h3><p><span class="rule">Buffer:</span> A solution that resists pH changes when small amounts of acid or base are added.</p><p><span class="rule">Components:</span> Weak acid + its conjugate base (e.g., CH₃COOH + CH₃COO⁻)</p><p><span class="rule">Henderson-Hasselbalch:</span> pH = pKa + log([A⁻]/[HA])</p><ul><li>When [A⁻] = [HA], pH = pKa (maximum buffer capacity)</li><li>Adding acid: the conjugate base (A⁻) reacts with it</li><li>Adding base: the weak acid (HA) reacts with it</li></ul>',
  52: '<h3>Titration Curves</h3><table><tr><th>Titration type</th><th>Equivalence pH</th><th>Good indicator</th></tr><tr><td>Strong acid + strong base</td><td>7</td><td>Phenolphthalein or bromothymol blue</td></tr><tr><td>Weak acid + strong base</td><td>> 7</td><td>Phenolphthalein</td></tr><tr><td>Strong acid + weak base</td><td>< 7</td><td>Methyl orange</td></tr></table><p><span class="rule">Half-equivalence point:</span> pH = pKa (for weak acid titrations).</p><p><span class="rule">Titrant:</span> Solution in the buret. <span class="rule">Analyte:</span> Solution in the flask.</p>',
  53: '<h3>Solubility Equilibrium (Ksp)</h3><p><span class="rule">Ksp</span> = solubility product constant for sparingly soluble salts.</p><p>For A<sub>x</sub>B<sub>y</sub>(s) ⇌ xA<sup>n+</sup>(aq) + yB<sup>m−</sup>(aq): Ksp = [A<sup>n+</sup>]<sup>x</sup>[B<sup>m−</sup>]<sup>y</sup></p><ul><li>Pure solids NOT included in Ksp</li><li>Smaller Ksp = less soluble</li><li><span class="rule">Common ion effect:</span> Adding a common ion decreases solubility</li><li>If Q > Ksp → precipitate forms</li><li>If Q < Ksp → more dissolves</li></ul>',
  54: '<h3>Net Ionic Equations</h3><p><span class="rule">Steps:</span></p><ul><li>1. Write the balanced molecular equation</li><li>2. Split all strong electrolytes (soluble ionic compounds, strong acids/bases) into ions</li><li>3. Cancel spectator ions (appear unchanged on both sides)</li><li>4. What remains is the net ionic equation</li></ul><p><span class="rule">Driving forces:</span> Precipitate (solid), gas, or water formation.</p><p><span class="rule">Keep as molecules:</span> Weak electrolytes, precipitates, gases, water.</p>',
  55: '<h3>Calorimetry</h3><p><span class="rule">q = mcΔT</span> (q = heat, m = mass, c = specific heat, ΔT = temperature change)</p><table><tr><th>Calorimeter</th><th>Measures at constant</th></tr><tr><td>Coffee-cup</td><td>Pressure (ΔH)</td></tr><tr><td>Bomb</td><td>Volume (ΔE)</td></tr></table><p><span class="rule">Hess\'s Law:</span> Total enthalpy change depends only on the initial and final states, not the path taken.</p><p>Specific heat of water: c = 4.18 J/(g·°C)</p>',
  56: '<h3>Main Group Descriptive Chemistry</h3><table><tr><th>Group</th><th>Name</th><th>Properties</th></tr><tr><td>1</td><td>Alkali metals</td><td>Soft, reactive with H₂O, form +1 ions</td></tr><tr><td>2</td><td>Alkaline earth metals</td><td>Reactive (less than G1), form +2 ions</td></tr><tr><td>17</td><td>Halogens</td><td>Very reactive nonmetals, form −1 ions</td></tr><tr><td>18</td><td>Noble gases</td><td>Unreactive, full valence shells</td></tr></table><p><span class="rule">Most reactive metal:</span> Cs/Fr (bottom-left). <span class="rule">Most reactive nonmetal:</span> F (top-right of nonmetals).</p><p>Hydrogen can form H⁺ (like metals) or H⁻ (like nonmetals).</p>',
  57: '<h3>Alcohols, Ethers & Phenols</h3><table><tr><th>Class</th><th>Structure</th><th>Suffix/Name</th></tr><tr><td>Alcohol</td><td>R-OH</td><td>-ol</td></tr><tr><td>Ether</td><td>R-O-R\'</td><td>ether</td></tr><tr><td>Phenol</td><td>Ar-OH (benzene-OH)</td><td>phenol</td></tr></table><p><span class="rule">Classification:</span></p><ul><li>1° alcohol: -OH on carbon bonded to 1 other C</li><li>2° alcohol: -OH on carbon bonded to 2 other C</li><li>3° alcohol: -OH on carbon bonded to 3 other C</li></ul><p>Methanol (CH₃OH), Ethanol (C₂H₅OH) are common alcohols.</p>',
  58: '<h3>Aldehydes & Ketones</h3><p>Both contain the <span class="rule">carbonyl group (C=O)</span>.</p><table><tr><th>Type</th><th>Position of C=O</th><th>Suffix</th><th>Example</th></tr><tr><td>Aldehyde</td><td>End of chain (-CHO)</td><td>-al</td><td>Methanal (formaldehyde)</td></tr><tr><td>Ketone</td><td>Middle of chain</td><td>-one</td><td>Propanone (acetone)</td></tr></table><p><span class="rule">Tollens\' test:</span> Silver mirror test, positive for aldehydes only (Ag⁺ → Ag mirror). Ketones do NOT react.</p>',
  59: '<h3>Carboxylic Acids & Esters</h3><p><span class="rule">Carboxylic acid:</span> R-COOH (suffix: -oic acid)</p><p><span class="rule">Ester:</span> R-COO-R\' (suffix: -oate)</p><table><tr><th>Reaction</th><th>Name</th></tr><tr><td>Acid + Alcohol → Ester + H₂O</td><td>Esterification</td></tr><tr><td>Ester + H₂O → Acid + Alcohol</td><td>Hydrolysis</td></tr><tr><td>Fat/Oil + Strong base → Soap + Glycerol</td><td>Saponification</td></tr></table><p>Common: formic acid (HCOOH), acetic acid (CH₃COOH).</p>',
  60: '<h3>Amines & Amides</h3><table><tr><th>Class</th><th>Structure</th><th>Properties</th></tr><tr><td>1° amine</td><td>R-NH₂</td><td>Basic (lone pair on N)</td></tr><tr><td>2° amine</td><td>R₂NH</td><td>Basic</td></tr><tr><td>3° amine</td><td>R₃N</td><td>Basic</td></tr><tr><td>Amide</td><td>R-CO-NH₂</td><td>Weakly basic / neutral</td></tr></table><p><span class="rule">Peptide bond:</span> A special amide bond linking amino acids in proteins: -CO-NH-</p><p>Amines are derivatives of NH₃. IUPAC suffix: -amine.</p>',
  61: '<h3>Stereochemistry</h3><p><span class="rule">Chiral center:</span> Carbon with 4 different groups → molecule is chiral (non-superimposable on mirror image).</p><table><tr><th>Term</th><th>Definition</th></tr><tr><td>Enantiomers</td><td>Non-superimposable mirror images</td></tr><tr><td>Diastereomers</td><td>Stereoisomers that are NOT mirror images</td></tr><tr><td>Racemic mixture</td><td>50:50 mix of both enantiomers (no net optical rotation)</td></tr></table><p><span class="rule">R/S naming (CIP rules):</span> Assign priority by atomic number → if clockwise = R, counterclockwise = S (with lowest priority pointing away).</p><p>Max stereoisomers = 2<sup>n</sup> (n = number of chiral centers).</p>',
  62: '<h3>Reaction Mechanisms</h3><table><tr><th>Mechanism</th><th>Steps</th><th>Prefers</th><th>Stereochemistry</th></tr><tr><td>SN2</td><td>1 (concerted)</td><td>Primary / methyl</td><td>Inversion</td></tr><tr><td>SN1</td><td>2 (carbocation)</td><td>Tertiary</td><td>Racemization</td></tr><tr><td>E2</td><td>1 (concerted)</td><td>Strong base, 2°/3°</td><td>Anti-periplanar</td></tr><tr><td>E1</td><td>2 (carbocation)</td><td>Tertiary, weak base</td><td>—</td></tr></table><p><span class="rule">SN1/E1:</span> Both go through carbocation intermediate. <span class="rule">SN2:</span> Strong nucleophile, no rearrangement. <span class="rule">E2:</span> Strong, bulky base promotes elimination.</p>',
  63: '<h3>Carbohydrates</h3><p><span class="rule">General formula:</span> Cₙ(H₂O)ₙ</p><table><tr><th>Type</th><th>Examples</th></tr><tr><td>Monosaccharides</td><td>Glucose, Fructose, Galactose</td></tr><tr><td>Disaccharides</td><td>Sucrose (Glu+Fru), Lactose (Glu+Gal), Maltose (Glu+Glu)</td></tr><tr><td>Polysaccharides</td><td>Starch, Cellulose, Glycogen (all from glucose)</td></tr></table><p><span class="rule">Glycosidic bond:</span> Links monosaccharides together (α or β linkage).</p><p>Glucose and fructose are isomers (same formula C₆H₁₂O₆, different structure).</p>',
  64: '<h3>Lipids & Proteins</h3><p><span class="rule">Lipids:</span> Hydrophobic biomolecules (fats, oils, waxes, phospholipids).</p><ul><li>Saturated: no C=C double bonds (solid at room temp)</li><li>Unsaturated: one or more C=C double bonds (liquid at room temp)</li></ul><p><span class="rule">Protein structure levels:</span></p><table><tr><th>Level</th><th>Description</th></tr><tr><td>Primary</td><td>Amino acid sequence</td></tr><tr><td>Secondary</td><td>α-helix, β-pleated sheet (H-bonds)</td></tr><tr><td>Tertiary</td><td>3D folding (various interactions)</td></tr><tr><td>Quaternary</td><td>Multiple polypeptide subunits</td></tr></table><p><span class="rule">Denaturation:</span> Loss of 3D structure (by heat, pH, etc.).</p>',
  65: '<h3>Nucleic Acids & DNA/RNA</h3><p><span class="rule">Nucleotide</span> = sugar + phosphate + nitrogenous base</p><table><tr><th></th><th>DNA</th><th>RNA</th></tr><tr><td>Sugar</td><td>Deoxyribose</td><td>Ribose</td></tr><tr><td>Strands</td><td>Double</td><td>Single</td></tr><tr><td>Bases</td><td>A, T, C, G</td><td>A, U, C, G</td></tr></table><p><span class="rule">Base pairing:</span> A=T (DNA) or A=U (RNA), C≡G (3 H-bonds). A-T has 2 H-bonds.</p><p><span class="rule">DNA:</span> Deoxyribonucleic acid (stores genetic info). <span class="rule">RNA:</span> Ribonucleic acid (protein synthesis).</p>',
  66: '<h3>Comprehensive Final Review</h3><ul><li><span class="rule">pH:</span> −log[H⁺]. pH + pOH = 14.</li><li><span class="rule">Bond order:</span> (bonding − antibonding) / 2</li><li><span class="rule">Buffer:</span> Weak acid + conjugate base. pH = pKa + log([A⁻]/[HA])</li><li><span class="rule">SN2:</span> 1 step, primary, inversion. <span class="rule">SN1:</span> 2 steps, tertiary, racemization.</li><li><span class="rule">Glucose:</span> Monosaccharide, C₆H₁₂O₆</li><li><span class="rule">Peptide bond:</span> Amide bond linking amino acids</li><li><span class="rule">Triple point:</span> All 3 phases coexist</li><li><span class="rule">Racemic mixture:</span> Equal enantiomers, no net optical rotation</li></ul>',
  67: '<h3>Chemistry Fundamentals</h3><p><span class="rule">Significant Figures Rules:</span></p><ul><li>Non-zero digits are always significant</li><li>Zeros between sig digits are significant (captured zeros)</li><li>Leading zeros are never significant</li><li>Trailing zeros with a decimal point are significant</li></ul><p><span class="rule">Scientific Notation:</span> N × 10ⁿ where 1 ≤ N &lt; 10</p><p><span class="rule">Density:</span> d = m/V (g/mL or g/cm³)</p><p><span class="rule">Temperature:</span> K = °C + 273.15, °F = (9/5)°C + 32</p>',
  68: '<h3>Matter Classification</h3><p><span class="rule">Pure Substance:</span> Element (one type of atom) or Compound (chemically bonded)</p><p><span class="rule">Mixture:</span> Homogeneous (uniform) or Heterogeneous (not uniform)</p><p><span class="rule">Physical change:</span> No new substance formed (melting, boiling)</p><p><span class="rule">Chemical change:</span> New substance formed (rusting, burning)</p>',
  69: '<h3>Historical Atomic Models</h3><ul><li><span class="rule">Dalton (1803):</span> Indivisible atoms, elements differ by mass</li><li><span class="rule">Thomson (1897):</span> Plum pudding model, discovered electron</li><li><span class="rule">Rutherford (1911):</span> Nuclear model, gold foil experiment</li><li><span class="rule">Bohr (1913):</span> Electrons in fixed orbits/energy levels</li><li><span class="rule">Quantum (1926):</span> Electron cloud, probability orbitals</li></ul><p><span class="rule">Laws:</span> Conservation of mass (Lavoisier), Definite proportions (Proust), Multiple proportions (Dalton)</p>',
  70: '<h3>Electronegativity & Bond Polarity</h3><p><span class="rule">Electronegativity:</span> Ability to attract bonding electrons</p><p><span class="rule">Most EN:</span> F (4.0). Trend: increases across period, decreases down group.</p><table><tr><th>ΔEN</th><th>Bond Type</th></tr><tr><td>0-0.4</td><td>Nonpolar covalent</td></tr><tr><td>0.5-1.7</td><td>Polar covalent</td></tr><tr><td>≥1.8</td><td>Ionic</td></tr></table><p><span class="rule">Dipole moment:</span> Points from δ+ to δ−. Symmetric molecules can be nonpolar despite polar bonds.</p>',
  71: '<h3>Hybridization & Sigma/Pi Bonds</h3><table><tr><th>Hybridization</th><th>Geometry</th><th>Bond Angle</th><th>Example</th></tr><tr><td>sp</td><td>Linear</td><td>180°</td><td>CO₂</td></tr><tr><td>sp²</td><td>Trigonal planar</td><td>120°</td><td>BF₃</td></tr><tr><td>sp³</td><td>Tetrahedral</td><td>109.5°</td><td>CH₄</td></tr><tr><td>sp³d</td><td>Trigonal bipyramidal</td><td>90°/120°</td><td>PCl₅</td></tr><tr><td>sp³d²</td><td>Octahedral</td><td>90°</td><td>SF₆</td></tr></table><p><span class="rule">Sigma (σ):</span> Head-on overlap, first bond. <span class="rule">Pi (π):</span> Side-by-side, second/third bond.</p>',
  72: '<h3>Percent Composition & Empirical Formulas</h3><p><span class="rule">% composition:</span> (atoms × atomic mass / molar mass) × 100</p><p><span class="rule">Empirical formula steps:</span></p><ul><li>1. Assume 100 g → grams = percentages</li><li>2. Convert to moles (÷ atomic mass)</li><li>3. Divide all by smallest moles</li><li>4. Multiply to whole numbers if needed</li></ul><p><span class="rule">Molecular formula:</span> n = molar mass / empirical mass → molecular = n × empirical</p>',
  73: '<h3>Gibbs Free Energy & Entropy</h3><p><span class="rule">ΔG = ΔH − TΔS</span></p><table><tr><th>ΔH</th><th>ΔS</th><th>Spontaneous?</th></tr><tr><td>−</td><td>+</td><td>Always</td></tr><tr><td>+</td><td>−</td><td>Never</td></tr><tr><td>−</td><td>−</td><td>Low T</td></tr><tr><td>+</td><td>+</td><td>High T</td></tr></table><p><span class="rule">Entropy:</span> Measure of disorder. S: gas > liquid > solid. More particles = more entropy.</p>',
  74: '<h3>Lattice Energy & Born-Haber Cycle</h3><p><span class="rule">Lattice energy:</span> Energy to separate ionic solid into gaseous ions.</p><p><span class="rule">Trends:</span> Higher charge → higher LE. Smaller ions → higher LE. (Coulomb\'s law: E ∝ q₁q₂/r)</p><p><span class="rule">Born-Haber cycle:</span> Applies Hess\'s law to find lattice energy from sublimation, ionization, dissociation, electron affinity, and formation enthalpy.</p>',
  75: '<h3>Salt Hydrolysis</h3><table><tr><th>Acid + Base</th><th>Salt Solution</th></tr><tr><td>Strong + Strong</td><td>Neutral (pH=7)</td></tr><tr><td>Strong + Weak</td><td>Acidic (pH&lt;7)</td></tr><tr><td>Weak + Strong</td><td>Basic (pH&gt;7)</td></tr><tr><td>Weak + Weak</td><td>Compare Ka vs Kb</td></tr></table><p><span class="rule">Hydrolysis:</span> Conjugate of weak component reacts with water to shift pH.</p>',
  76: '<h3>Paramagnetic & Diamagnetic</h3><p><span class="rule">Paramagnetic:</span> Has unpaired electrons → attracted to magnet.</p><p><span class="rule">Diamagnetic:</span> All electrons paired → slightly repelled.</p><p><span class="rule">Ferromagnetic:</span> Fe, Co, Ni → strongly attracted, permanent magnetism.</p><p><span class="rule">To determine:</span> Write electron configuration → check for unpaired e⁻ (Hund\'s rule).</p>',
  77: '<h3>Newman Projections</h3><p><span class="rule">Newman projection:</span> View along C-C bond axis. Front carbon = dot, back = circle.</p><p><span class="rule">Staggered:</span> 60° dihedral, lowest energy. <span class="rule">Eclipsed:</span> 0° dihedral, highest energy.</p><p><span class="rule">Butane:</span> Anti (180°) most stable > gauche (60°) > eclipsed (120°) > fully eclipsed (0°).</p>',
  78: '<h3>Chair Conformations</h3><p><span class="rule">Cyclohexane chair:</span> Most stable, all bonds staggered.</p><p><span class="rule">Axial:</span> Up/down. <span class="rule">Equatorial:</span> Outward. Large groups prefer equatorial (less 1,3-diaxial strain).</p><p><span class="rule">Ring flip:</span> All axial ↔ equatorial. <span class="rule">A-value:</span> Measures equatorial preference.</p>',
  79: '<h3>Spectroscopy (IR & MS)</h3><table><tr><th>Bond</th><th>IR (cm⁻¹)</th></tr><tr><td>O-H (alcohol)</td><td>3200-3550</td></tr><tr><td>O-H (acid)</td><td>2500-3300</td></tr><tr><td>N-H</td><td>3300-3500</td></tr><tr><td>C=O</td><td>1700-1750</td></tr><tr><td>C≡C</td><td>2100-2260</td></tr></table><p><span class="rule">MS:</span> M⁺ = molecular weight. Common losses: -15 (CH₃), -17 (OH), -18 (H₂O), -28 (CO).</p>',
  80: '<h3>Conjugated Systems & Diels-Alder</h3><p><span class="rule">Conjugated diene:</span> Alternating single/double bonds, more stable than isolated.</p><p><span class="rule">1,2 vs 1,4 addition:</span> Kinetic (1,2) at low T, thermodynamic (1,4) at high T.</p><p><span class="rule">Diels-Alder:</span> [4+2] cycloaddition. Diene (s-cis, electron-rich) + dienophile (electron-poor) → 6-membered ring. Concerted, syn addition.</p>',
  81: '<h3>Free Radical Reactions</h3><p><span class="rule">Three stages:</span> Initiation (radicals formed), Propagation (chain), Termination (radicals combine).</p><p><span class="rule">Radical stability:</span> 3° > 2° > 1° > methyl (allyl/benzyl stabilized by resonance).</p><p><span class="rule">Selectivity:</span> Br₂ more selective than Cl₂ (prefers 3°). Anti-Markovnikov with HBr + peroxide.</p>',
  82: '<h3>Alpha Carbon & Enolate Chemistry</h3><p><span class="rule">Alpha carbon:</span> C adjacent to C=O. Alpha H is acidic (pKa ~20).</p><p><span class="rule">Enolate:</span> Resonance-stabilized conjugate base. Formed with strong base (LDA, NaOH).</p><p><span class="rule">Aldol:</span> β-hydroxy carbonyl → dehydration → α,β-unsaturated carbonyl.</p><p><span class="rule">Claisen:</span> Ester + ester → β-keto ester (with NaOEt).</p>',
  83: '<h3>Crystal Types & Solids</h3><table><tr><th>Type</th><th>Particles</th><th>Forces</th><th>Properties</th></tr><tr><td>Ionic</td><td>Ions</td><td>Electrostatic</td><td>High MP, brittle, conduct dissolved</td></tr><tr><td>Molecular</td><td>Molecules</td><td>IMFs</td><td>Low MP, soft, nonconducting</td></tr><tr><td>Metallic</td><td>Metal atoms</td><td>Metallic bond</td><td>Variable MP, malleable, conduct</td></tr><tr><td>Network covalent</td><td>Atoms</td><td>Covalent bonds</td><td>Very high MP, very hard</td></tr></table><p><span class="rule">Unit cells:</span> SC = 1 atom (52%), BCC = 2 atoms (68%), FCC = 4 atoms (74%).</p>',
  84: '<h3>Heating Curves</h3><p><span class="rule">Sloped regions:</span> Temperature changes, use q = mcΔT (specific heat).</p><p><span class="rule">Flat regions:</span> Phase changes, temperature constant, use q = nΔH.</p><p><span class="rule">Key values (water):</span> ΔHfus = 6.02 kJ/mol, ΔHvap = 40.7 kJ/mol.</p><p><span class="rule">Steeper slope = lower specific heat</span> (less energy to raise T).</p><p>Phases in order: solid → liquid → gas. Exothermic reverse: condensation, freezing.</p>',
  85: '<h3>Vapor Pressure & Clausius-Clapeyron</h3><p><span class="rule">Vapor pressure (VP):</span> Pressure of vapor in equilibrium with liquid. Increases with T.</p><p><span class="rule">Clausius-Clapeyron:</span> ln(P₂/P₁) = −ΔHvap/R × (1/T₂ − 1/T₁)</p><p><span class="rule">Boiling point:</span> When VP = atmospheric pressure.</p><p><span class="rule">Raoult\'s law:</span> P_solution = χ_solvent × P°_solvent. Nonvolatile solute lowers VP.</p><p>Volatile liquids: weak IMFs → high VP → low boiling point.</p>',
  86: '<h3>Concentration Units</h3><table><tr><th>Unit</th><th>Formula</th><th>Notes</th></tr><tr><td>Molarity (M)</td><td>mol solute / L solution</td><td>T-dependent</td></tr><tr><td>Molality (m)</td><td>mol solute / kg solvent</td><td>T-independent</td></tr><tr><td>Mole fraction (χ)</td><td>n_i / n_total</td><td>0 to 1, dimensionless</td></tr><tr><td>Mass %</td><td>(mass solute / mass soln) × 100</td><td>—</td></tr><tr><td>ppm</td><td>parts per million (mg/L)</td><td>Dilute solutions</td></tr><tr><td>Normality (N)</td><td>M × n-factor</td><td>Equiv/L</td></tr></table>',
  87: '<h3>Integrated Rate Laws</h3><table><tr><th>Order</th><th>Rate Law</th><th>Linear Plot</th><th>t½</th><th>k units</th></tr><tr><td>0</td><td>rate = k</td><td>[A] vs t</td><td>[A]₀/2k</td><td>M/s</td></tr><tr><td>1</td><td>rate = k[A]</td><td>ln[A] vs t</td><td>ln2/k</td><td>s⁻¹</td></tr><tr><td>2</td><td>rate = k[A]²</td><td>1/[A] vs t</td><td>1/(k[A]₀)</td><td>M⁻¹s⁻¹</td></tr></table><p><span class="rule">Arrhenius:</span> k = Ae^(−Ea/RT). Higher T → larger k → faster reaction.</p>',
  88: '<h3>Reaction Mechanisms</h3><p><span class="rule">Mechanism:</span> Series of elementary steps that sum to the overall reaction.</p><p><span class="rule">Rate-determining step (RDS):</span> Slowest step controls overall rate.</p><p><span class="rule">Intermediate:</span> Formed in one step, consumed in another (not in overall equation).</p><p><span class="rule">Catalyst:</span> Lowers Ea, not consumed. Homogeneous = same phase, heterogeneous = different phase.</p><p><span class="rule">Molecularity:</span> Unimolecular (1), bimolecular (2), termolecular (3, rare).</p>',
  89: '<h3>Polyprotic Acids & Complex Ions</h3><p><span class="rule">Polyprotic acids:</span> Ka1 > Ka2 > Ka3 (each ionization harder).</p><p>H₃PO₄: 3 steps. H₂SO₄: 2 steps (strong for 1st only).</p><p><span class="rule">Amphoteric:</span> Can act as acid or base (e.g., H₂O, HCO₃⁻, Al(OH)₃).</p><p><span class="rule">Complex ions:</span> Metal + ligands. Kf (formation constant) large → stable complex → increases solubility of insoluble salts.</p>',
  90: '<h3>Electrochemistry (Advanced)</h3><p><span class="rule">Nernst equation:</span> E = E° − (RT/nF)lnQ = E° − (0.0592/n)logQ at 25°C.</p><p><span class="rule">Cell notation:</span> Anode (left) || Cathode (right). || = salt bridge.</p><p><span class="rule">Faraday:</span> F = 96485 C/mol e⁻. ΔG° = −nFE°.</p><p><span class="rule">Electrolysis:</span> Non-spontaneous, requires external power. m = MIt/(nF).</p><p><span class="rule">Concentration cell:</span> E° = 0, driven by concentration difference.</p>',
  91: '<h3>Nuclear Binding Energy & Dating</h3><p><span class="rule">Mass defect (Δm):</span> Predicted mass − actual mass. Converted to energy via E = Δmc².</p><p><span class="rule">Binding energy/nucleon:</span> Peak at Fe-56 (most stable). Fusion (light) and fission (heavy) both move toward Fe.</p><p><span class="rule">Radioactive dating:</span> C-14 t½ = 5730 years (organic). U-238 t½ = 4.5 billion years (rocks).</p><p><span class="rule">Decay:</span> After n half-lives, fraction remaining = (1/2)ⁿ.</p>',
  92: '<h3>Photoelectric Effect & de Broglie</h3><p><span class="rule">Photoelectric:</span> E_photon = hν. KE_max = hν − φ (work function). Below threshold ν₀: no electrons.</p><p><span class="rule">Intensity:</span> More photons = more electrons (not more KE).</p><p><span class="rule">de Broglie:</span> λ = h/mv. Significant for small particles (electrons).</p><p><span class="rule">Heisenberg:</span> ΔxΔp ≥ h/(4π). Cannot know position and momentum simultaneously.</p>',
  93: '<h3>Resonance & Formal Charge</h3><p><span class="rule">Formal charge:</span> FC = V − N − B/2 (V = valence, N = nonbonding, B = bonding e⁻).</p><p><span class="rule">Best structure:</span> FC closest to zero, negative FC on more electronegative atom.</p><p><span class="rule">Resonance:</span> Multiple valid Lewis structures differing only in electron positions. Real structure is hybrid.</p><p><span class="rule">Exceptions:</span> BF₃ (incomplete octet, 6e⁻), SF₆ (expanded octet, 12e⁻), NO (odd electron).</p>',
  94: '<h3>Solution Stoichiometry</h3><p><span class="rule">Solubility rules:</span> All nitrates soluble. All Na⁺/K⁺/NH₄⁺ soluble. Most Cl⁻/Br⁻/I⁻ soluble (except Ag⁺, Pb²⁺, Hg₂²⁺). Most SO₄²⁻ soluble (except Ba²⁺, Pb²⁺).</p><p><span class="rule">Net ionic equation:</span> Remove spectator ions (unchanged on both sides).</p><p><span class="rule">Activity series:</span> More active metals displace less active ones. Zn above Cu → Zn replaces Cu²⁺.</p>',
  95: '<h3>Chemical Reaction Types</h3><table><tr><th>Type</th><th>Pattern</th><th>Example</th></tr><tr><td>Synthesis</td><td>A + B → AB</td><td>2Na + Cl₂ → 2NaCl</td></tr><tr><td>Decomposition</td><td>AB → A + B</td><td>2H₂O → 2H₂ + O₂</td></tr><tr><td>Single Replacement</td><td>A + BC → AC + B</td><td>Zn + CuSO₄ → ZnSO₄ + Cu</td></tr><tr><td>Double Replacement</td><td>AB + CD → AD + CB</td><td>AgNO₃ + NaCl → AgCl + NaNO₃</td></tr><tr><td>Combustion</td><td>CₓHᵧ + O₂ → CO₂ + H₂O</td><td>CH₄ + 2O₂ → CO₂ + 2H₂O</td></tr></table><p><span class="rule">Key:</span> Identify by counting reactants/products and checking for O₂.</p>',
  96: '<h3>Predicting Products</h3><p><span class="rule">Activity series (partial):</span> Li > K > Ca > Na > Mg > Al > Zn > Fe > Ni > Sn > Pb > H > Cu > Ag > Au</p><p>A metal higher on the series can replace a lower one from solution.</p><p><span class="rule">Solubility rules:</span></p><ul><li>All Na⁺, K⁺, NH₄⁺, NO₃⁻ salts are soluble</li><li>Most Cl⁻, Br⁻, I⁻ soluble (except Ag⁺, Pb²⁺, Hg₂²⁺)</li><li>Most SO₄²⁻ soluble (except Ba²⁺, Pb²⁺, Ca²⁺)</li><li>Most OH⁻, CO₃²⁻, PO₄³⁻, S²⁻ are insoluble</li></ul>',
  97: '<h3>Redox Reactions</h3><p><span class="rule">Oxidation number rules:</span></p><ul><li>Free element = 0</li><li>Monatomic ion = charge</li><li>O = −2 (except peroxides −1)</li><li>H = +1 (except metal hydrides −1)</li><li>Sum = charge of species</li></ul><p><span class="rule">LEO GER:</span> Lose Electrons = Oxidation, Gain Electrons = Reduction</p><p><span class="rule">Oxidizing agent:</span> Gets reduced (gains e⁻). <span class="rule">Reducing agent:</span> Gets oxidized (loses e⁻).</p>',
  98: '<h3>Acid-Base Theories</h3><table><tr><th>Theory</th><th>Acid</th><th>Base</th></tr><tr><td>Arrhenius</td><td>Produces H⁺ in water</td><td>Produces OH⁻ in water</td></tr><tr><td>Brønsted-Lowry</td><td>Proton (H⁺) donor</td><td>Proton (H⁺) acceptor</td></tr><tr><td>Lewis</td><td>Electron pair acceptor</td><td>Electron pair donor</td></tr></table><p><span class="rule">7 strong acids:</span> HCl, HBr, HI, HNO₃, H₂SO₄, HClO₃, HClO₄</p><p><span class="rule">Strong bases:</span> Group 1 hydroxides (NaOH, KOH) and Ca(OH)₂, Ba(OH)₂, Sr(OH)₂</p>',
  99: '<h3>pH & pOH</h3><p><span class="rule">Key formulas:</span></p><ul><li>pH = −log[H⁺]</li><li>pOH = −log[OH⁻]</li><li>pH + pOH = 14 (at 25°C)</li><li>Kw = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴</li></ul><table><tr><th>pH</th><th>Type</th></tr><tr><td>0–6</td><td>Acidic</td></tr><tr><td>7</td><td>Neutral</td></tr><tr><td>8–14</td><td>Basic</td></tr></table><p><span class="rule">Shortcut:</span> If [H⁺] = 10⁻ˣ, then pH = x.</p>',
  100: '<h3>Neutralization & Titration</h3><p><span class="rule">Neutralization:</span> acid + base → salt + water</p><p>HCl + NaOH → NaCl + H₂O</p><p><span class="rule">Titration formula:</span> MₐVₐ = MᵦVᵦ (for monoprotic)</p><table><tr><th>Indicator</th><th>pH Range</th><th>Color Change</th></tr><tr><td>Methyl orange</td><td>3.1–4.4</td><td>Red → Yellow</td></tr><tr><td>Litmus</td><td>5–8</td><td>Red → Blue</td></tr><tr><td>Phenolphthalein</td><td>8.2–10</td><td>Colorless → Pink</td></tr></table><p><span class="rule">Equivalence point:</span> moles acid = moles base. pH = 7 for strong/strong.</p>',
  101: '<h3>Electron Configuration (Complete)</h3><p><span class="rule">Aufbau order:</span> 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d 7p</p><p><span class="rule">Exceptions (half/full d):</span></p><ul><li>Cr (Z=24): [Ar] 4s¹ 3d⁵ (not 4s² 3d⁴)</li><li>Cu (Z=29): [Ar] 4s¹ 3d¹⁰ (not 4s² 3d⁹)</li></ul><p><span class="rule">Ion configurations:</span> Remove electrons from the highest n first (4s before 3d).</p><p>Fe²⁺: [Ar] 3d⁶ (remove 2 from 4s). Fe³⁺: [Ar] 3d⁵ (remove 2 from 4s, 1 from 3d).</p>',
  102: '<h3>Electronegativity & Bond Polarity</h3><p><span class="rule">EN trend:</span> Increases left → right across a period, decreases top → bottom in a group.</p><p>Most electronegative: F (4.0) > O (3.5) > N/Cl (3.0)</p><table><tr><th>ΔEN</th><th>Bond Type</th></tr><tr><td>0 – 0.4</td><td>Nonpolar covalent</td></tr><tr><td>0.5 – 1.7</td><td>Polar covalent</td></tr><tr><td>> 1.7</td><td>Ionic</td></tr></table><p><span class="rule">δ⁺/δ⁻:</span> In a polar bond, δ⁻ is on the more electronegative atom.</p>',
  103: '<h3>Polar & Nonpolar Molecules</h3><p><span class="rule">Key principle:</span> Molecular geometry determines polarity, not just bond polarity.</p><p>Symmetric molecules with identical polar bonds → dipoles cancel → <span class="rule">nonpolar</span>.</p><table><tr><th>Molecule</th><th>Shape</th><th>Polar?</th></tr><tr><td>CO₂</td><td>Linear</td><td>No (cancels)</td></tr><tr><td>H₂O</td><td>Bent</td><td>Yes</td></tr><tr><td>NH₃</td><td>Trigonal pyramidal</td><td>Yes</td></tr><tr><td>CH₄</td><td>Tetrahedral</td><td>No (symmetric)</td></tr><tr><td>BF₃</td><td>Trigonal planar</td><td>No (symmetric)</td></tr><tr><td>SF₆</td><td>Octahedral</td><td>No (symmetric)</td></tr></table>',
  104: '<h3>Matter Classification</h3><p><span class="rule">Flowchart:</span> Matter → Can it be separated physically? Yes → <span class="rule">Mixture</span> (homogeneous = uniform, heterogeneous = not uniform). No → <span class="rule">Pure Substance</span> (can it be decomposed chemically? Yes → compound, No → element).</p><p><span class="rule">7 diatomic elements:</span> H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂ (HOFBrINCl)</p><table><tr><th>Type</th><th>Example</th></tr><tr><td>Element</td><td>Au, O₂, Fe</td></tr><tr><td>Compound</td><td>H₂O, NaCl, CO₂</td></tr><tr><td>Homogeneous mix</td><td>Saltwater, air, alloys</td></tr><tr><td>Heterogeneous mix</td><td>Salad, granite, blood</td></tr></table>',
  105: '<h3>Intermolecular Forces (IMF)</h3><table><tr><th>Type</th><th>Requirement</th><th>Strength</th></tr><tr><td>London Dispersion (LDF)</td><td>All molecules</td><td>Weakest</td></tr><tr><td>Dipole-Dipole</td><td>Polar molecules</td><td>Moderate</td></tr><tr><td>Hydrogen Bonding</td><td>H bonded to F, O, or N</td><td>Strong</td></tr><tr><td>Ion-Dipole</td><td>Ion + polar molecule</td><td>Strongest</td></tr></table><p><span class="rule">LDF increases with:</span> More electrons, larger molar mass, greater surface area.</p><p><span class="rule">Key:</span> IMF are between molecules (inter), not within them (intra = covalent bonds).</p>',
  106: '<h3>IMF & Physical Properties</h3><p><span class="rule">Stronger IMF →</span></p><ul><li>Higher boiling/melting point</li><li>Higher viscosity (resistance to flow)</li><li>Higher surface tension</li><li>Lower vapor pressure</li></ul><p><span class="rule">Volatile substances:</span> Weak IMF → evaporate easily → high vapor pressure.</p><table><tr><th>Substance</th><th>Dominant IMF</th><th>BP</th></tr><tr><td>CH₄</td><td>LDF only</td><td>−161°C</td></tr><tr><td>HCl</td><td>Dipole-dipole</td><td>−85°C</td></tr><tr><td>H₂O</td><td>H-bonding</td><td>100°C</td></tr><tr><td>NaCl (aq)</td><td>Ion-dipole</td><td>N/A (dissolved)</td></tr></table>',
  107: '<h3>Polyatomic Ions — Complete Reference</h3><table><tr><th>Name</th><th>Formula</th><th>Charge</th></tr><tr><td>Ammonium</td><td>NH₄⁺</td><td>+1</td></tr><tr><td>Hydroxide</td><td>OH⁻</td><td>−1</td></tr><tr><td>Nitrate</td><td>NO₃⁻</td><td>−1</td></tr><tr><td>Nitrite</td><td>NO₂⁻</td><td>−1</td></tr><tr><td>Bicarbonate</td><td>HCO₃⁻</td><td>−1</td></tr><tr><td>Acetate</td><td>CH₃COO⁻</td><td>−1</td></tr><tr><td>Cyanide</td><td>CN⁻</td><td>−1</td></tr><tr><td>Permanganate</td><td>MnO₄⁻</td><td>−1</td></tr><tr><td>Hypochlorite</td><td>ClO⁻</td><td>−1</td></tr><tr><td>Chlorite</td><td>ClO₂⁻</td><td>−1</td></tr><tr><td>Chlorate</td><td>ClO₃⁻</td><td>−1</td></tr><tr><td>Perchlorate</td><td>ClO₄⁻</td><td>−1</td></tr><tr><td>Thiocyanate</td><td>SCN⁻</td><td>−1</td></tr><tr><td>Carbonate</td><td>CO₃²⁻</td><td>−2</td></tr><tr><td>Sulfate</td><td>SO₄²⁻</td><td>−2</td></tr><tr><td>Sulfite</td><td>SO₃²⁻</td><td>−2</td></tr><tr><td>Chromate</td><td>CrO₄²⁻</td><td>−2</td></tr><tr><td>Dichromate</td><td>Cr₂O₇²⁻</td><td>−2</td></tr><tr><td>Oxalate</td><td>C₂O₄²⁻</td><td>−2</td></tr><tr><td>Phosphate</td><td>PO₄³⁻</td><td>−3</td></tr></table><p><span class="rule">Naming pattern:</span> -ate (more O) → -ite (less O). per-...-ate (most O) → hypo-...-ite (least O).</p><p><span class="rule">Only positive ion:</span> NH₄⁺ (ammonium).</p>',
  108: '<h3>Periodic Table — Elements Reference</h3><p><span class="rule">Groups (columns):</span> 1–18. <span class="rule">Periods (rows):</span> 1–7.</p><table><tr><th>Group</th><th>Name</th><th>Key elements</th></tr><tr><td>1</td><td>Alkali metals</td><td>Li, Na, K, Rb, Cs</td></tr><tr><td>2</td><td>Alkaline earth metals</td><td>Be, Mg, Ca, Sr, Ba</td></tr><tr><td>3–12</td><td>Transition metals</td><td>Fe, Cu, Zn, Ag, Au</td></tr><tr><td>17</td><td>Halogens</td><td>F, Cl, Br, I</td></tr><tr><td>18</td><td>Noble gases</td><td>He, Ne, Ar, Kr, Xe</td></tr></table><p><span class="rule">Blocks:</span> s-block (groups 1–2), p-block (groups 13–18), d-block (groups 3–12), f-block (lanthanides/actinides).</p><p><span class="rule">Metalloids:</span> B, Si, Ge, As, Sb, Te — staircase line between metals and nonmetals.</p><p><span class="rule">7 diatomic elements:</span> H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂ (HOFBrINCl).</p>',
  109: '<h3>Periodic Trends</h3><table><tr><th>Property</th><th>Across period (→)</th><th>Down group (↓)</th><th>Why</th></tr><tr><td>Atomic radius</td><td>Decreases</td><td>Increases</td><td>More protons pull e⁻ closer / more shells</td></tr><tr><td>Ionization energy</td><td>Increases</td><td>Decreases</td><td>Harder to remove e⁻ / farther from nucleus</td></tr><tr><td>Electronegativity</td><td>Increases</td><td>Decreases</td><td>Stronger pull on bonding e⁻</td></tr><tr><td>Electron affinity</td><td>More negative</td><td>Less negative</td><td>More tendency to gain e⁻</td></tr><tr><td>Metallic character</td><td>Decreases</td><td>Increases</td><td>Metals lose e⁻ easily</td></tr></table><p><span class="rule">Effective nuclear charge (Zeff):</span> Net positive charge felt by valence electrons. Increases across a period (more protons, similar shielding).</p><p><span class="rule">Shielding:</span> Inner electrons shield outer electrons from nuclear charge. More shells = more shielding = weaker hold.</p><p><span class="rule">Exceptions:</span> IE dips at B (2s→2p) and O (electron pairing in 2p).</p>',
  110: '<h3>Chemical Reactions — All Types</h3><table><tr><th>Type</th><th>Pattern</th><th>Example</th></tr><tr><td>Synthesis</td><td>A + B → AB</td><td>2Na + Cl₂ → 2NaCl</td></tr><tr><td>Decomposition</td><td>AB → A + B</td><td>2H₂O → 2H₂ + O₂</td></tr><tr><td>Single replacement</td><td>A + BC → AC + B</td><td>Zn + CuSO₄ → ZnSO₄ + Cu</td></tr><tr><td>Double replacement</td><td>AB + CD → AD + CB</td><td>AgNO₃ + NaCl → AgCl↓ + NaNO₃</td></tr><tr><td>Combustion</td><td>CₓHᵧ + O₂ → CO₂ + H₂O</td><td>CH₄ + 2O₂ → CO₂ + 2H₂O</td></tr></table><p><span class="rule">Redox:</span> OIL RIG — Oxidation Is Loss, Reduction Is Gain (of electrons).</p><p><span class="rule">Oxidation number rules:</span> Free element = 0, O = −2, H = +1, monatomic ion = charge, sum = formula charge.</p><p><span class="rule">Activity series (partial):</span> Li > K > Ca > Na > Mg > Al > Zn > Fe > Ni > Sn > Pb > H > Cu > Ag > Au</p>',
  111: '<h3>Intramolecular vs Intermolecular Forces</h3><table><tr><th>Type</th><th>Category</th><th>Strength</th></tr><tr><td>Ionic bond</td><td>Intramolecular</td><td>Very strong</td></tr><tr><td>Covalent bond</td><td>Intramolecular</td><td>Strong</td></tr><tr><td>Metallic bond</td><td>Intramolecular</td><td>Variable</td></tr><tr><td>Ion-dipole</td><td>Intermolecular</td><td>Strong (IMF)</td></tr><tr><td>Hydrogen bonding</td><td>Intermolecular</td><td>Moderate-strong</td></tr><tr><td>Dipole-dipole</td><td>Intermolecular</td><td>Moderate</td></tr><tr><td>London dispersion</td><td>Intermolecular</td><td>Weak</td></tr></table><p><span class="rule">Key distinction:</span> Intramolecular = within a molecule (bonds). Intermolecular = between molecules (attractions).</p><p><span class="rule">Boiling:</span> Breaks intermolecular forces only. <span class="rule">Decomposition:</span> Breaks intramolecular bonds.</p><p><span class="rule">Intramolecular forces are ALWAYS stronger</span> than intermolecular forces.</p>',
  112: '<h3>Acid-Base Comprehensive</h3><table><tr><th>Theory</th><th>Acid</th><th>Base</th></tr><tr><td>Arrhenius</td><td>Produces H⁺ in water</td><td>Produces OH⁻ in water</td></tr><tr><td>Brønsted-Lowry</td><td>Proton donor</td><td>Proton acceptor</td></tr><tr><td>Lewis</td><td>Electron pair acceptor</td><td>Electron pair donor</td></tr></table><p><span class="rule">Strong acids (6):</span> HCl, HBr, HI, HNO₃, H₂SO₄, HClO₄</p><p><span class="rule">Strong bases:</span> NaOH, KOH, LiOH, Ca(OH)₂, Ba(OH)₂, Sr(OH)₂</p><p><span class="rule">pH formulas:</span> pH = −log[H⁺], pOH = −log[OH⁻], pH + pOH = 14, Kw = 10⁻¹⁴</p><p><span class="rule">Ka:</span> Larger Ka = stronger acid. pKa = −log(Ka).</p><p><span class="rule">Buffer:</span> Weak acid + conjugate base. Henderson-Hasselbalch: pH = pKa + log([A⁻]/[HA]).</p><p><span class="rule">Conjugate pairs:</span> Differ by one H⁺. Stronger acid → weaker conjugate base.</p>'
};

let score = 0;
let total = 0;
const totalInputs = countTotalInputs();

function countTotalInputs() {
  let c = 0;
  for (const ex of EXERCISES) {
    if (ex.type === 'mc') c += ex.questions.length;
    else c += ex.rows.length;
  }
  return c;
}

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score + ' / ' + totalInputs;
  const pct = totalInputs > 0 ? Math.round(score / totalInputs * 100) : 0;
  document.getElementById('pctDisplay').textContent = '(' + pct + '%)';
  if (typeof saveProgress === 'function') saveProgress(true);
}

function normalize(s) {
  return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[?.!,]+$/,'').replace(/[?.!,]+/g,function(m){return m;});
}

function checkAnswer(inputEl) {
  if (inputEl.classList.contains('correct')) return;

  const wasWrong = inputEl.classList.contains('wrong');
  if (wasWrong) {
    inputEl.classList.remove('wrong');
    inputEl.readOnly = false;
    inputEl.classList.remove('answered');
    const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
    if (revealEl) { revealEl.classList.remove('show'); revealEl.textContent = ''; }
    const hintEl = inputEl.parentElement.querySelector('.hint-text');
    if (hintEl) { hintEl.classList.remove('show'); hintEl.textContent = ''; delete hintEl.dataset.level; }
  }

  const userVal = normalizeForCompare(inputEl.value);
  if (!userVal) return;

  const answers = inputEl.dataset.answer.split('/').map(a => normalizeForCompare(a));
  const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
  let matched = false;

  for (const ans of answers) {
    if (userVal === ans) { matched = true; break; }
    const userNoPunct = userVal.replace(/[?.!,]/g,'').trim();
    const ansNoPunct = ans.replace(/[?.!,]/g,'').trim();
    if (userNoPunct === ansNoPunct) { matched = true; break; }
  }

  if (matched) {
    inputEl.readOnly = true;
    inputEl.classList.add('answered','correct');
    score++;
    const cm = document.createElement('span');
    cm.className = 'checkmark';
    cm.textContent = ' \u2713';
    inputEl.parentElement.appendChild(cm);
  } else {
    inputEl.classList.add('wrong');
    if (revealEl) {
      revealEl.textContent = '\u2192 ' + inputEl.dataset.answer.split('/')[0].trim();
      revealEl.classList.add('show');
    }
  }
  updateScore();
  if (matched) focusNext(inputEl);
}

function focusNext(currentEl) {
  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(currentEl);
  for (let i = idx + 1; i < allInputs.length; i++) {
    if (!allInputs[i].classList.contains('correct')) { ensureVisibleAndFocus(allInputs[i]); return; }
  }
}

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  score = 0; total = 0;
  document.querySelectorAll('input[type="text"]').forEach(el => {
    el.value = ''; el.readOnly = false;
    el.classList.remove('answered','correct','wrong');
    const cm = el.parentElement.querySelector('.checkmark');
    if (cm) cm.remove();
    const rev = el.parentElement.querySelector('.answer-reveal');
    if (rev) { rev.classList.remove('show'); rev.textContent = ''; }
    const hint = el.parentElement.querySelector('.hint-text');
    if (hint) { hint.classList.remove('show'); hint.textContent = ''; delete hint.dataset.level; }
  });
  document.querySelectorAll('input[type="radio"]').forEach(el => {
    el.checked = false; el.disabled = false;
  });
  document.querySelectorAll('.mc-option').forEach(el => {
    el.classList.remove('correct-choice','wrong-choice','reveal-correct','locked','answered');
  });
  document.querySelectorAll('.mc-group').forEach(el => el.classList.remove('answered'));
  localStorage.removeItem(STORAGE_KEY);
  updateScore();
  const first = document.querySelector('input[type="text"]');
  if (first) first.focus();
}

const STORAGE_KEY = 'fye12_chemistry_exercises';

function saveProgress(silent) {
  const data = {score: score, inputs: [], radios: [], openExercises: []};

  document.querySelectorAll('input[type="text"]').forEach((el, i) => {
    data.inputs.push({
      value: el.value,
      correct: el.classList.contains('correct'),
      wrong: el.classList.contains('wrong')
    });
  });

  document.querySelectorAll('.mc-group').forEach((group, i) => {
    const selected = group.querySelector('input[type="radio"]:checked');
    data.radios.push({
      answered: group.classList.contains('answered'),
      selected: selected ? parseInt(selected.value) : null
    });
  });

  document.querySelectorAll('.exercise-body').forEach(body => {
    if (body.classList.contains('open')) data.openExercises.push(body.id);
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

  const status = document.getElementById('saveStatus');
  if (!silent) {
    status.textContent = 'Saved!';
    status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000);
  }
}

function applyProgress(data) {
  if (!data || !data.inputs) { updateScore(); return; }
  score = 0;

  const inputs = document.querySelectorAll('input[type="text"]');
  inputs.forEach((el, i) => {
    if (!data.inputs[i]) return;
    const saved = data.inputs[i];
    el.value = saved.value;
    if (saved.correct) {
      el.readOnly = true;
      el.classList.add('answered','correct');
      score++;
      const cm = document.createElement('span');
      cm.className = 'checkmark';
      cm.textContent = ' \u2713';
      el.parentElement.appendChild(cm);
    } else if (saved.wrong) {
      el.classList.add('wrong');
      const revealEl = el.parentElement.querySelector('.answer-reveal');
      if (revealEl) {
        revealEl.textContent = '\u2192 ' + el.dataset.answer.split('/')[0].trim();
        revealEl.classList.add('show');
      }
    }
  });

  const mcGroups = document.querySelectorAll('.mc-group');
  mcGroups.forEach((group, i) => {
    if (!data.radios[i] || !data.radios[i].answered) return;
    const saved = data.radios[i];
    group.classList.add('answered');
    const correctIdx = parseInt(group.dataset.correct);
    const options = group.querySelectorAll('.mc-option');
    const radio = group.querySelector('input[value="' + saved.selected + '"]');
    if (radio) radio.checked = true;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });
    if (saved.selected === correctIdx) {
      options[saved.selected].classList.add('correct-choice');
      score++;
    } else {
      options[saved.selected].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
  });

  if (data.openExercises) {
    document.querySelectorAll('.exercise-body').forEach(body => {
      const id = body.id.replace('body-','');
      const arrow = document.getElementById('arrow-' + id);
      if (data.openExercises.includes(body.id)) {
        body.classList.add('open');
        if (arrow) arrow.classList.add('open');
      } else {
        body.classList.remove('open');
        if (arrow) arrow.classList.remove('open');
      }
    });
  }

  updateScore();
}

function loadProgress() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) { updateScore(); return; }
  try { applyProgress(JSON.parse(raw)); } catch(e) { updateScore(); }
}

function toggleExercise(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function buildTableExercise(ex) {
  const answerColIdx = ex.cols.indexOf("Your Answer");
  const solutionColIdx = ex.cols.indexOf("Solution");

  let visibleCols = [];
  for (let i = 0; i < ex.cols.length; i++) {
    if (i === solutionColIdx) continue;
    visibleCols.push({colIdx: i, name: ex.cols[i]});
  }

  let html = '<table><thead><tr>';
  for (const vc of visibleCols) html += '<th>' + vc.name + '</th>';
  html += '</tr></thead><tbody>';

  for (const row of ex.rows) {
    html += '<tr>';
    const answer = row[row.length - 1];
    let dataIdx = 0;
    for (const vc of visibleCols) {
      if (vc.colIdx === answerColIdx) {
        html += '<td class="ex-cell"><input type="text" data-answer="' + escAttr(answer) + '" autocomplete="off" spellcheck="false"><div class="answer-reveal"></div></td>';
      } else if (vc.colIdx === 0) {
        html += '<td class="num">' + row[0] + '</td>';
        dataIdx++;
      } else {
        html += '<td>' + escHtml(row[dataIdx]) + '</td>';
        dataIdx++;
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  return html;
}

function buildMC(ex) {
  let html = '';
  ex.questions.forEach((q, qi) => {
    const name = 'mc_' + ex.id + '_' + qi;
    html += '<div class="mc-group" data-correct="' + q.correct + '" data-name="' + name + '">';
    html += '<div class="mc-q">' + (qi+1) + '. ' + escHtml(q.q) + '</div>';
    q.options.forEach((opt, oi) => {
      html += '<label class="mc-option" data-idx="' + oi + '"><input type="radio" name="' + name + '" value="' + oi + '"> ' + escHtml(opt) + '</label>';
    });
    html += '</div>';
  });
  return html;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showTheory(id) {
  const overlay = document.getElementById('theoryOverlay');
  const content = document.getElementById('theoryBody');
  content.innerHTML = THEORY[id] || '<p>No theory available for this exercise.</p>';
  overlay.classList.add('show');
}

function hideTheory() {
  document.getElementById('theoryOverlay').classList.remove('show');
}

// Build all exercises
const app = document.getElementById('app');
for (const ex of EXERCISES) {
  let bodyHtml = '';
  if (ex.instruction) bodyHtml += '<p class="instruction">' + escHtml(ex.instruction) + '</p>';
  if (ex.rule) bodyHtml += '<div class="rule-box">' + escHtml(ex.rule) + '</div>';

  if (ex.type === 'mc') bodyHtml += buildMC(ex);
  else bodyHtml += buildTableExercise(ex);

  const paddedId = String(ex.id).padStart(2,'0');
  const hasPractice = ex.id <= 112;
  const slug = hasPractice ? SLUGS[ex.id - 1] : null;

  let practiceHtml = '';
  if (hasPractice) {
    practiceHtml = '<a href="practice/practice-' + paddedId + '-' + slug + '.html" class="practice-link" onclick="event.stopPropagation()" title="Extra Practice">\u2192</a><span class="practice-badge" id="badge-' + ex.id + '"></span>';
  }

  app.innerHTML += '<div class="exercise">' +
      '<div class="exercise-header" onclick="toggleExercise(' + ex.id + ')">' +
        '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">' +
          '<h2>Exercise ' + ex.id + ' - ' + escHtml(ex.title) + '</h2>' +
          practiceHtml +
          '<span class="info-icon" onclick="event.stopPropagation();showTheory(' + ex.id + ')" title="Theory">i</span>' +
        '</div>' +
        '<span class="arrow" id="arrow-' + ex.id + '">\u25B6</span>' +
      '</div>' +
      '<div class="exercise-body" id="body-' + ex.id + '">' +
        bodyHtml +
      '</div>' +
    '</div>';
}

// Open first exercise by default
toggleExercise(1);

function ensureVisibleAndFocus(input) {
  const body = input.closest('.exercise-body');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    const id = body.id.replace('body-','');
    const arrow = document.getElementById('arrow-' + id);
    if (arrow) arrow.classList.add('open');
  }
  input.focus();
  input.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    saveProgress();
    return;
  }

  if (e.ctrlKey && e.key === 'i' && e.target.matches('input[type="text"]')) {
    e.preventDefault();
    if (e.target.classList.contains('correct')) return;
    const answer = e.target.dataset.answer;
    if (!answer) return;
    const primary = answer.split('/')[0].trim();
    let hintEl = e.target.parentElement.querySelector('.hint-text');
    if (!hintEl) {
      hintEl = document.createElement('div');
      hintEl.className = 'hint-text';
      e.target.parentElement.appendChild(hintEl);
    }
    if (hintEl.dataset.level === '1') {
      hintEl.textContent = '\u2192 ' + primary;
      hintEl.dataset.level = '2';
    } else {
      const hintLen = Math.min(3, Math.ceil(primary.length * 0.3));
      hintEl.textContent = 'Hint: ' + primary.substring(0, hintLen) + '...';
      hintEl.dataset.level = '1';
    }
    hintEl.classList.add('show');
    return;
  }

  if (e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    window.scrollBy({top: e.key === 'ArrowDown' ? 400 : -400, behavior:'smooth'});
    return;
  }

  if (e.key === 'Tab' && e.target.matches('input[type="text"]')) {
    const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
    const idx = allInputs.indexOf(e.target);
    if (idx === -1) return;
    const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < allInputs.length) {
      e.preventDefault();
      ensureVisibleAndFocus(allInputs[nextIdx]);
    }
    return;
  }

  if (!e.target.matches('input[type="text"]')) return;

  if (e.key === 'Enter') {
    e.preventDefault();
    checkAnswer(e.target);
    return;
  }

  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(e.target);
  if (idx === -1) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  } else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) {
    e.preventDefault();
    if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]);
  } else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) {
    e.preventDefault();
    if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]);
  }
});

// Event delegation for MC radio buttons
document.addEventListener('change', function(e) {
  if (e.target.matches('input[type="radio"]')) {
    const group = e.target.closest('.mc-group');
    if (!group || group.classList.contains('answered')) return;
    group.classList.add('answered');

    const correctIdx = parseInt(group.dataset.correct);
    const selectedIdx = parseInt(e.target.value);
    const options = group.querySelectorAll('.mc-option');

    total++;
    options.forEach(opt => {
      opt.classList.add('locked');
      opt.querySelector('input').disabled = true;
    });

    if (selectedIdx === correctIdx) {
      options[selectedIdx].classList.add('correct-choice');
      score++;
    } else {
      options[selectedIdx].classList.add('wrong-choice');
      options[correctIdx].classList.add('reveal-correct');
    }
    updateScore();
  }
});

function loadPracticeBadges() {
  for (let i = 1; i <= 112; i++) {
    const key = 'fye12_practice_' + String(i).padStart(2,'0');
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const data = JSON.parse(raw);
      if (typeof data.total !== 'number' || data.total === 0) continue;
      const badge = document.getElementById('badge-' + i);
      if (!badge) continue;
      const s = data.score || 0;
      badge.textContent = s + '/' + data.total;
      badge.classList.add('has-progress');
      if (s === data.total) badge.classList.add('complete');
    } catch(e) {}
  }
}

loadProgress();
loadPracticeBadges();
setTimeout(() => {
  const first = document.querySelector('input[type="text"]:not(.correct)');
  if (first) ensureVisibleAndFocus(first);
}, 100);
</script>

  <div class="theory-content">
    <span class="close-theory" onclick="hideTheory()">&times;</span>
    <div id="theoryBody"></div>
  </div>
</div>
