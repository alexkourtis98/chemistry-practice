let score = 0;
let totalInputs = 0;

function countInputs() {
  let c = 0;
  for (const s of SECTIONS) {
    if (s.type === 'mc') c += s.questions.length;
    else if (s.type === 'arrange') c += s.sentences.length;
    else c += s.rows.length;
  }
  return c;
}
totalInputs = countInputs();

function updateScore() {
  document.getElementById('scoreDisplay').textContent = score + ' / ' + totalInputs;
  const pct = totalInputs > 0 ? Math.round(score / totalInputs * 100) : 0;
  document.getElementById('pctDisplay').textContent = '(' + pct + '%)';
  saveProgress(true);
}

function normalizeForCompare(s) {
  s = s.trim().toLowerCase().replace(/\s+/g,' ');
  s = s.replace(/ά/g,'α').replace(/έ/g,'ε').replace(/ή/g,'η').replace(/ί/g,'ι')
       .replace(/ό/g,'ο').replace(/ύ/g,'υ').replace(/ώ/g,'ω').replace(/ΐ/g,'ι').replace(/ΰ/g,'υ');
  s = s.replace(/₀/g,'0').replace(/₁/g,'1').replace(/₂/g,'2').replace(/₃/g,'3').replace(/₄/g,'4')
       .replace(/₅/g,'5').replace(/₆/g,'6').replace(/₇/g,'7').replace(/₈/g,'8').replace(/₉/g,'9');
  s = s.replace(/⁺/g,'+').replace(/⁻/g,'-');
  return s;
}

function checkAnswer(inputEl) {
  if (inputEl.classList.contains('correct')) return;
  if (inputEl.classList.contains('wrong')) {
    inputEl.classList.remove('wrong');
    inputEl.readOnly = false;
    inputEl.classList.remove('answered');
    const rev = inputEl.parentElement.querySelector('.answer-reveal');
    if (rev) { rev.classList.remove('show'); rev.textContent = ''; }
    const hint = inputEl.parentElement.querySelector('.hint-text');
    if (hint) { hint.classList.remove('show'); hint.textContent = ''; delete hint.dataset.level; }
  }
  const userVal = normalizeForCompare(inputEl.value);
  if (!userVal) return;
  const answers = inputEl.dataset.answer.split('/').map(a => normalizeForCompare(a));
  const revealEl = inputEl.parentElement.querySelector('.answer-reveal');
  let matched = false;
  for (const ans of answers) {
    if (userVal === ans) { matched = true; break; }
    const uNP = userVal.replace(/[?.!,]/g,'').trim();
    const aNP = ans.replace(/[?.!,]/g,'').trim();
    if (uNP === aNP) { matched = true; break; }
  }
  if (matched) {
    inputEl.readOnly = true;
    inputEl.classList.add('answered','correct');
    score++;
    const cm = document.createElement('span');
    cm.className = 'checkmark'; cm.textContent = ' \u2713';
    inputEl.parentElement.appendChild(cm);
  } else {
    inputEl.classList.add('wrong');
    if (revealEl) { revealEl.textContent = '\u2192 ' + inputEl.dataset.answer.split('/')[0].trim(); revealEl.classList.add('show'); }
  }
  updateScore();
  if (matched) focusNext(inputEl);
}

function focusNext(el) {
  const all = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = all.indexOf(el);
  for (let i = idx+1; i < all.length; i++) { if (!all[i].classList.contains('correct')) { ensureVisibleAndFocus(all[i]); return; } }
}

function ensureVisibleAndFocus(input) {
  const body = input.closest('.exercise-body');
  if (body && !body.classList.contains('open')) {
    body.classList.add('open');
    const id = body.id.replace('body-','');
    const arrow = document.getElementById('arrow-' + id);
    if (arrow) arrow.classList.add('open');
  }
  input.focus();
  input.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function toggleExercise(id) {
  const body = document.getElementById('body-' + id);
  const arrow = document.getElementById('arrow-' + id);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildTable(section) {
  let html = '<table><thead><tr><th>#</th><th>Prompt</th><th>Your Answer</th></tr></thead><tbody>';
  for (const row of section.rows) {
    html += '<tr><td class="num">' + row[0] + '</td><td>' + escHtml(row[1]) + '</td>';
    html += '<td class="ex-cell"><input type="text" data-answer="' + escAttr(row[2]) + '" autocomplete="off" spellcheck="false"><div class="answer-reveal"></div></td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function buildMC(section) {
  let html = '';
  section.questions.forEach((q, qi) => {
    const name = 'mc_' + section.id + '_' + qi;
    html += '<div class="mc-group" data-correct="' + q.correct + '" data-name="' + name + '">';
    html += '<div class="mc-q">' + (qi+1) + '. ' + escHtml(q.q) + '</div>';
    q.options.forEach((opt, oi) => {
      html += '<label class="mc-option" data-idx="' + oi + '"><input type="radio" name="' + name + '" value="' + oi + '"> ' + escHtml(opt) + '</label>';
    });
    html += '</div>';
  });
  return html;
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function buildArrange(section) {
  let html = '';
  section.sentences.forEach((s, si) => {
    const gid = 'arrange_' + section.id + '_' + si;
    const correctStr = s.words.join(' ');
    const shuffled = shuffleArray(s.words);
    html += '<div class="arrange-group" id="' + gid + '" data-correct="' + escAttr(correctStr) + '">';
    html += '<div class="arrange-prompt">' + (si+1) + '. ' + escHtml(s.prompt) + '</div>';
    html += '<div class="arrange-answer" id="' + gid + '_answer"></div>';
    html += '<div class="arrange-bank" id="' + gid + '_bank">';
    shuffled.forEach(function(w) {
      html += '<span class="word-chip" data-word="' + escAttr(w) + '" data-gid="' + gid + '" onclick="arrangeClick(this)">' + escHtml(w) + '</span>';
    });
    html += '</div>';
    html += '<button class="arrange-check-btn" onclick="checkArrange(\'' + gid + '\')">Check \u21B5</button>';
    html += '<button class="arrange-retry-btn" onclick="retryArrange(\'' + gid + '\')">Retry</button>';
    html += '<div class="arrange-reveal"></div>';
    html += '</div>';
  });
  return html;
}

function arrangeClick(chip) {
  var gid = chip.dataset.gid;
  var group = document.getElementById(gid);
  if (group.classList.contains('answered')) return;
  var answer = document.getElementById(gid + '_answer');
  var bank = document.getElementById(gid + '_bank');
  if (chip.parentElement === bank) {
    chip.classList.add('placed');
    var clone = chip.cloneNode(true);
    clone.classList.remove('placed');
    clone.classList.add('in-answer');
    clone.onclick = function() { arrangeRemove(this); };
    answer.appendChild(clone);
  }
}

function arrangeRemove(chip) {
  var gid = chip.dataset.gid;
  var group = document.getElementById(gid);
  if (group.classList.contains('answered')) return;
  var bank = document.getElementById(gid + '_bank');
  var word = chip.dataset.word;
  var allPlaced = bank.querySelectorAll('.word-chip.placed');
  for (var k = 0; k < allPlaced.length; k++) {
    if (allPlaced[k].dataset.word === word) { allPlaced[k].classList.remove('placed'); break; }
  }
  chip.remove();
}

function checkArrange(gid) {
  var group = document.getElementById(gid);
  if (group.classList.contains('answered')) return;
  var answer = document.getElementById(gid + '_answer');
  var chips = answer.querySelectorAll('.word-chip');
  if (chips.length === 0) return;
  var userWords = Array.from(chips).map(function(c) { return c.dataset.word; }).join(' ');
  var correct = group.dataset.correct;
  group.classList.add('answered');
  if (userWords === correct) {
    group.classList.add('correct');
    score++;
  } else {
    group.classList.add('wrong');
    var reveal = group.querySelector('.arrange-reveal');
    reveal.textContent = '\u2192 ' + correct;
  }
  updateScore();
}

function retryArrange(gid) {
  var group = document.getElementById(gid);
  if (!group.classList.contains('wrong')) return;
  group.classList.remove('answered','wrong');
  var answer = document.getElementById(gid + '_answer');
  var bank = document.getElementById(gid + '_bank');
  answer.innerHTML = '';
  bank.querySelectorAll('.word-chip.placed').forEach(function(c) { c.classList.remove('placed'); });
  var reveal = group.querySelector('.arrange-reveal');
  if (reveal) { reveal.textContent = ''; }
  saveProgress(true);
}

const SECTION_THEORY = '<h3>VSEPR & Molecular Geometry - Complete Reference</h3><p><span class="rule">VSEPR Theory:</span> Valence Shell Electron Pair Repulsion. Electron domains (bonding pairs + lone pairs) arrange around the central atom to minimize repulsion. A double or triple bond counts as ONE electron domain.</p><p><span class="rule">Complete VSEPR Table:</span></p><table><tr><th>e\u207B Domains</th><th>e\u207B Geometry</th><th>Lone Pairs</th><th>Molecular Geometry</th><th>Example</th><th>Bond Angle</th><th>Hybrid</th></tr><tr><td>2</td><td>Linear</td><td>0</td><td>Linear</td><td>CO\u2082, BeCl\u2082</td><td>180\u00B0</td><td>sp</td></tr><tr><td>3</td><td>Trigonal planar</td><td>0</td><td>Trigonal planar</td><td>BF\u2083, SO\u2083</td><td>120\u00B0</td><td>sp\u00B2</td></tr><tr><td>3</td><td>Trigonal planar</td><td>1</td><td>Bent</td><td>SO\u2082, O\u2083</td><td>&lt;120\u00B0</td><td>sp\u00B2</td></tr><tr><td>4</td><td>Tetrahedral</td><td>0</td><td>Tetrahedral</td><td>CH\u2084, CCl\u2084</td><td>109.5\u00B0</td><td>sp\u00B3</td></tr><tr><td>4</td><td>Tetrahedral</td><td>1</td><td>Trigonal pyramidal</td><td>NH\u2083, NF\u2083</td><td>~107\u00B0</td><td>sp\u00B3</td></tr><tr><td>4</td><td>Tetrahedral</td><td>2</td><td>Bent</td><td>H\u2082O, H\u2082S</td><td>~104.5\u00B0</td><td>sp\u00B3</td></tr><tr><td>5</td><td>Trig. bipyramidal</td><td>0</td><td>Trig. bipyramidal</td><td>PCl\u2085</td><td>90\u00B0/120\u00B0</td><td>sp\u00B3d</td></tr><tr><td>5</td><td>Trig. bipyramidal</td><td>1</td><td>Seesaw</td><td>SF\u2084</td><td>~90\u00B0/~120\u00B0</td><td>sp\u00B3d</td></tr><tr><td>5</td><td>Trig. bipyramidal</td><td>2</td><td>T-shaped</td><td>ClF\u2083</td><td>~90\u00B0</td><td>sp\u00B3d</td></tr><tr><td>5</td><td>Trig. bipyramidal</td><td>3</td><td>Linear</td><td>XeF\u2082</td><td>180\u00B0</td><td>sp\u00B3d</td></tr><tr><td>6</td><td>Octahedral</td><td>0</td><td>Octahedral</td><td>SF\u2086</td><td>90\u00B0</td><td>sp\u00B3d\u00B2</td></tr><tr><td>6</td><td>Octahedral</td><td>1</td><td>Square pyramidal</td><td>IF\u2085, BrF\u2085</td><td>~90\u00B0</td><td>sp\u00B3d\u00B2</td></tr><tr><td>6</td><td>Octahedral</td><td>2</td><td>Square planar</td><td>XeF\u2084</td><td>90\u00B0</td><td>sp\u00B3d\u00B2</td></tr></table><p><span class="rule">Lone Pair Effects:</span> Lone pairs occupy MORE space than bonding pairs because they are held closer to the nucleus. Order of repulsion: LP-LP > LP-BP > BP-BP. This compresses bond angles below the ideal values. In trigonal bipyramidal, lone pairs always go in equatorial positions first (more room).</p><p><span class="rule">Hybridization:</span></p><table><tr><th>e\u207B Domains</th><th>Hybridization</th><th>Geometry</th><th>Orbitals Mixed</th></tr><tr><td>2</td><td>sp</td><td>Linear</td><td>1s + 1p</td></tr><tr><td>3</td><td>sp\u00B2</td><td>Trigonal planar</td><td>1s + 2p</td></tr><tr><td>4</td><td>sp\u00B3</td><td>Tetrahedral</td><td>1s + 3p</td></tr><tr><td>5</td><td>sp\u00B3d</td><td>Trig. bipyramidal</td><td>1s + 3p + 1d</td></tr><tr><td>6</td><td>sp\u00B3d\u00B2</td><td>Octahedral</td><td>1s + 3p + 2d</td></tr></table><p><span class="rule">Polarity:</span> A molecule is polar if (1) it has polar bonds AND (2) the bond dipoles do NOT cancel due to geometry. Symmetric geometries (linear with identical bonds, trigonal planar, tetrahedral, octahedral with all same substituents) are nonpolar. Asymmetric geometries (bent, trig. pyramidal, seesaw, T-shaped, square pyramidal) are typically polar.</p><p><span class="rule">Sigma (\u03C3) and Pi (\u03C0) Bonds:</span></p><table><tr><th>Bond Type</th><th>\u03C3 Bonds</th><th>\u03C0 Bonds</th><th>Overlap</th></tr><tr><td>Single</td><td>1</td><td>0</td><td>Head-on</td></tr><tr><td>Double</td><td>1</td><td>1</td><td>\u03C3: head-on, \u03C0: side-by-side</td></tr><tr><td>Triple</td><td>1</td><td>2</td><td>\u03C3: head-on, 2\u03C0: side-by-side</td></tr></table><p>\u03C3 bonds form from head-on overlap (s-s, s-p, p-p, or hybrid orbitals). \u03C0 bonds form from side-by-side overlap of unhybridized p orbitals. \u03C0 bonds restrict rotation around the bond axis.</p>';
function showTheory() { document.getElementById('theoryBody').innerHTML = SECTION_THEORY; document.getElementById('theoryOverlay').classList.add('show'); }
function hideTheory() { document.getElementById('theoryOverlay').classList.remove('show'); }

const app = document.getElementById('app');
for (const s of SECTIONS) {
  let bodyHtml = '';
  if (s.instruction) bodyHtml += '<p class="instruction">' + escHtml(s.instruction) + '</p>';
  if (s.rule) bodyHtml += '<div class="rule-box">' + escHtml(s.rule) + '</div>';
  if (s.type === 'mc') bodyHtml += buildMC(s);
  else if (s.type === 'arrange') bodyHtml += buildArrange(s);
  else bodyHtml += buildTable(s);

  app.innerHTML += `
    <div class="exercise">
      <div class="exercise-header" onclick="toggleExercise(${s.id})">
        <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
          <h2>Section ${s.id} - ${escHtml(s.title)}</h2>
          <span class="info-icon" onclick="event.stopPropagation();showTheory()" title="Theory">i</span>
        </div>
        <span class="arrow" id="arrow-${s.id}">\u25B6</span>
      </div>
      <div class="exercise-body" id="body-${s.id}">

}

toggleExercise(1);

function resetAll() {
  if (!confirm('Reset all progress? This cannot be undone.')) return;
  score = 0;
  document.querySelectorAll('input[type="text"]').forEach(el => {
    el.value = ''; el.readOnly = false;
    el.classList.remove('answered','correct','wrong');
    const cm = el.parentElement.querySelector('.checkmark'); if (cm) cm.remove();
    const rev = el.parentElement.querySelector('.answer-reveal'); if (rev) { rev.classList.remove('show'); rev.textContent = ''; }
    const hint = el.parentElement.querySelector('.hint-text'); if (hint) { hint.classList.remove('show'); hint.textContent = ''; delete hint.dataset.level; }
  });
  document.querySelectorAll('input[type="radio"]').forEach(el => { el.checked = false; el.disabled = false; });
  document.querySelectorAll('.mc-option').forEach(el => { el.classList.remove('correct-choice','wrong-choice','reveal-correct','locked','answered'); });
  document.querySelectorAll('.mc-group').forEach(el => el.classList.remove('answered'));
  document.querySelectorAll('.arrange-group').forEach(function(g) {
    g.classList.remove('answered','correct','wrong');
    g.querySelector('.arrange-answer').innerHTML = '';
    g.querySelectorAll('.word-chip.placed').forEach(function(c) { c.classList.remove('placed'); });
    var rev = g.querySelector('.arrange-reveal'); if (rev) rev.textContent = '';
  });
  localStorage.removeItem(PAGE_ID);
  updateScore();
}

function saveProgress(silent) {
  const data = {score: score, total: totalInputs, inputs: [], radios: [], arranges: [], openExercises: []};
  document.querySelectorAll('input[type="text"]').forEach(el => {
    data.inputs.push({value: el.value, correct: el.classList.contains('correct'), wrong: el.classList.contains('wrong')});
  });
  document.querySelectorAll('.mc-group').forEach(group => {
    const sel = group.querySelector('input[type="radio"]:checked');
    data.radios.push({answered: group.classList.contains('answered'), selected: sel ? parseInt(sel.value) : null});
  });
  document.querySelectorAll('.arrange-group').forEach(group => {
    const chips = group.querySelector('.arrange-answer').querySelectorAll('.word-chip');
    data.arranges.push({answered: group.classList.contains('answered'), correct: group.classList.contains('correct'), wrong: group.classList.contains('wrong'), words: Array.from(chips).map(function(c){return c.dataset.word;})});
  });
  document.querySelectorAll('.exercise-body').forEach(body => {
    if (body.classList.contains('open')) data.openExercises.push(body.id);
  });
  localStorage.setItem(PAGE_ID, JSON.stringify(data));
  if (!silent) {
    const status = document.getElementById('saveStatus');
    status.textContent = 'Saved!'; status.classList.add('show');
    setTimeout(() => status.classList.remove('show'), 2000);
  }
}

function loadProgress() {
  const raw = localStorage.getItem(PAGE_ID);
  if (!raw) { updateScore(); return; }
  let data;
  try { data = JSON.parse(raw); } catch(e) { updateScore(); return; }
  score = 0;
  const inputs = document.querySelectorAll('input[type="text"]');
  inputs.forEach((el, i) => {
    if (!data.inputs[i]) return;
    const saved = data.inputs[i];
    el.value = saved.value;
    if (saved.correct) {
      el.readOnly = true; el.classList.add('answered','correct'); score++;
      const cm = document.createElement('span'); cm.className = 'checkmark'; cm.textContent = ' \u2713';
      el.parentElement.appendChild(cm);
    } else if (saved.wrong) {
      el.classList.add('wrong');
      const rev = el.parentElement.querySelector('.answer-reveal');
      if (rev) { rev.textContent = '\u2192 ' + el.dataset.answer.split('/')[0].trim(); rev.classList.add('show'); }
    }
  });
  const mcGroups = document.querySelectorAll('.mc-group');
  mcGroups.forEach((group, i) => {
    if (!data.radios[i] || !data.radios[i].answered) return;
    const saved = data.radios[i];
    group.classList.add('answered');
    const correctIdx = parseInt(group.dataset.correct);
    const options = group.querySelectorAll('.mc-option');
    const radio = group.querySelector('input[value="' + saved.selected + '"]');
    if (radio) radio.checked = true;
    options.forEach(opt => { opt.classList.add('locked'); opt.querySelector('input').disabled = true; });
    if (saved.selected === correctIdx) { options[saved.selected].classList.add('correct-choice'); score++; }
    else { options[saved.selected].classList.add('wrong-choice'); options[correctIdx].classList.add('reveal-correct'); }
  });
  const arrangeGroups = document.querySelectorAll('.arrange-group');
  if (data.arranges) {
    arrangeGroups.forEach(function(group, i) {
      if (!data.arranges[i]) return;
      const saved = data.arranges[i];
      if (saved.words && saved.words.length > 0) {
        const bank = group.querySelector('.arrange-bank');
        const answer = group.querySelector('.arrange-answer');
        saved.words.forEach(function(w) {
          var bankChips = bank.querySelectorAll('.word-chip:not(.placed)');
          for (var k = 0; k < bankChips.length; k++) {
            if (bankChips[k].dataset.word === w) {
              bankChips[k].classList.add('placed');
              var clone = bankChips[k].cloneNode(true);
              clone.classList.remove('placed');
              clone.classList.add('in-answer');
              clone.onclick = function() { arrangeRemove(this); };
              answer.appendChild(clone);
              break;
            }
          }
        });
      }
      if (saved.answered) {
        group.classList.add('answered');
        if (saved.correct) { group.classList.add('correct'); score++; }
        else if (saved.wrong) {
          group.classList.add('wrong');
          var reveal = group.querySelector('.arrange-reveal');
          if (reveal) reveal.textContent = '\u2192 ' + group.dataset.correct;
        }
      }
    });
  }
  if (data.openExercises) {
    document.querySelectorAll('.exercise-body').forEach(body => {
      const id = body.id.replace('body-','');
      const arrow = document.getElementById('arrow-' + id);
      if (data.openExercises.includes(body.id)) { body.classList.add('open'); if (arrow) arrow.classList.add('open'); }
      else { body.classList.remove('open'); if (arrow) arrow.classList.remove('open'); }
    });
  }
  updateScore();
}

document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveProgress(); return; }
  if (e.ctrlKey && e.key === 'i' && e.target.matches('input[type="text"]')) {
    e.preventDefault();
    if (e.target.classList.contains('correct')) return;
    const answer = e.target.dataset.answer; if (!answer) return;
    const primary = answer.split('/')[0].trim();
    let hintEl = e.target.parentElement.querySelector('.hint-text');
    if (!hintEl) { hintEl = document.createElement('div'); hintEl.className = 'hint-text'; e.target.parentElement.appendChild(hintEl); }
    if (hintEl.dataset.level === '1') { hintEl.textContent = '\u2192 ' + primary; hintEl.dataset.level = '2'; }
    else { const hintLen = Math.min(3, Math.ceil(primary.length * 0.3)); hintEl.textContent = 'Hint: ' + primary.substring(0, hintLen) + '...'; hintEl.dataset.level = '1'; }
    hintEl.classList.add('show'); return;
  }
  if (e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); window.scrollBy({top: e.key === 'ArrowDown' ? 400 : -400, behavior:'smooth'}); return; }
  if (e.key === 'Tab' && e.target.matches('input[type="text"]')) {
    const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
    const idx = allInputs.indexOf(e.target); if (idx === -1) return;
    const nextIdx = e.shiftKey ? idx - 1 : idx + 1;
    if (nextIdx >= 0 && nextIdx < allInputs.length) { e.preventDefault(); ensureVisibleAndFocus(allInputs[nextIdx]); }
    return;
  }
  if (!e.target.matches('input[type="text"]')) return;
  if (e.key === 'Enter') { e.preventDefault(); checkAnswer(e.target); return; }
  const allInputs = Array.from(document.querySelectorAll('input[type="text"]'));
  const idx = allInputs.indexOf(e.target); if (idx === -1) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]); }
  else if (e.key === 'ArrowRight' && e.target.selectionStart === e.target.value.length) { e.preventDefault(); if (idx < allInputs.length - 1) ensureVisibleAndFocus(allInputs[idx + 1]); }
  else if (e.key === 'ArrowLeft' && e.target.selectionStart === 0) { e.preventDefault(); if (idx > 0) ensureVisibleAndFocus(allInputs[idx - 1]); }
});

document.addEventListener('change', function(e) {
  if (e.target.matches('input[type="radio"]')) {
    const group = e.target.closest('.mc-group');
    if (!group || group.classList.contains('answered')) return;
    group.classList.add('answered');
    const correctIdx = parseInt(group.dataset.correct);
    const selectedIdx = parseInt(e.target.value);
    const options = group.querySelectorAll('.mc-option');
    options.forEach(opt => { opt.classList.add('locked'); opt.querySelector('input').disabled = true; });
    if (selectedIdx === correctIdx) { options[selectedIdx].classList.add('correct-choice'); score++; }
    else { options[selectedIdx].classList.add('wrong-choice'); options[correctIdx].classList.add('reveal-correct'); }
    updateScore();
  }
});

loadProgress();
document.querySelector('.subtitle').textContent = 'Deep practice \u2014 electron domains, geometry, polarity, hybridization \u2014 ' + totalInputs + ' questions';
setTimeout(() => { const first = document.querySelector('input[type="text"]:not(.correct)'); if (first) ensureVisibleAndFocus(first); }, 100);
</script>
<div class="theory-overlay" id="theoryOverlay" onclick="if(event.target===this)hideTheory()">
  <div class="theory-content">
    <span class="close-theory" onclick="hideTheory()">&times;</span>
    <div id="theoryBody"></div>
  </div>
</div>
</body>
</html>
